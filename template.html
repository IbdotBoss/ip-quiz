<html lang="en-GB">

<style>
@font-face{font-family:"Atkinson Next";src:url(data:font/woff2;base64,/*FONT*/) format("woff2");font-weight:200 800;font-display:swap}
:root{
  --paper:#fff;--ink:#17171c;--ink-2:#4a4a55;--hair:#d9d9df;--tint:#f1f1f4;
  --k0:#191919;--k1:#8c8c8c;--right:#18794e;--wrong:#b3261e;--focus:#2f5fd0;--off:#767680;
  --t-xs:.84rem;--t-s:.94rem;--t-m:1.0625rem;--t-l:1.375rem;--t-xl:2.25rem;--r:6px;
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t-m)/1.5 "Atkinson Next",Verdana,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 20px 72px;min-height:100dvh}
@media (min-width:800px){main{padding:48px 20px 96px}}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:var(--t-xl);font-weight:800;line-height:1.05}
h2{font-size:var(--t-l);font-weight:700;line-height:1.25;margin-top:36px}
h3{font-size:var(--t-m);font-weight:700;margin-top:24px}
h1:focus,h2:focus{outline:none}
p{margin:8px 0;text-wrap:pretty}
.s{font-size:var(--t-s);color:var(--ink-2)}
a{color:var(--ink)}
svg{display:block}
button,select,input{font:400 1rem/1.2 "Atkinson Next",Verdana,sans-serif;color:var(--ink)}
button,select{font-weight:700;background:var(--paper);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 20px;min-height:44px;cursor:pointer}
select{font-weight:400;padding:8px 12px;max-width:100%}
button.p{background:var(--ink);color:var(--paper)}
button.l{border:0;padding:12px 0;text-decoration:underline;font-weight:400;font-size:var(--t-s)}
button:active{transform:translateY(1px)}
:is(input,select):disabled{background:var(--tint);color:var(--ink);cursor:default}
.k0{background:var(--k0)}.k1{background:var(--k1)}.k2{background:var(--paper)}
:is(button,a,select,input,summary):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1.5px solid var(--ink);font-size:var(--t-s)}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}

/* home: one row per week, one square per question type */
.wk{border-top:1px solid var(--hair);padding:12px 0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.wk:first-of-type{border-top:1.5px solid var(--ink);margin-top:12px}
.wk>button{border:0;border-radius:0;padding:4px 0;min-height:32px;text-align:left;font-weight:400;display:flex;gap:12px}
.wk>button b{font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 1.6em}
.wk>button:hover span{text-decoration:underline}
.sq{display:flex;flex-wrap:wrap;gap:4px;padding-left:calc(1.6em + 12px)}
.sq button{width:36px;height:36px;min-height:0;padding:0;border:1px solid var(--ink);border-radius:0}
.sq button.new,.key .nw{background:repeating-linear-gradient(135deg,var(--paper) 0 5px,var(--hair) 5px 6.5px)}
.sq button:hover{outline:2px solid var(--ink);outline-offset:1px}
.key{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;font-size:var(--t-xs);color:var(--ink-2)}
.key i{width:16px;height:16px;border:1px solid var(--ink);display:block}

/* matrices drawn as pixels */
.figs{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;margin:16px 0}
figure{margin:0;max-width:100%}
figcaption{font-size:var(--t-s);font-weight:700;margin-bottom:4px}
.mx{border-collapse:collapse;font-variant-numeric:tabular-nums}
.mx td{border:1px solid var(--ink);min-width:44px;height:40px;padding:0 8px;text-align:center;font-weight:700;font-size:1.17rem}
.mx.k td{background:var(--tint);font-weight:400;font-size:var(--t-m)}
.mx td.in{box-shadow:inset 0 0 0 3px var(--focus)}
.mx input{width:52px;height:40px;border:0;text-align:center;background:var(--paper);font-size:var(--t-m);font-variant-numeric:tabular-nums}
.mx td.io{padding:0;min-width:52px}
.mx td.bad{box-shadow:inset 0 0 0 3px var(--wrong)}
.mx td.ok{box-shadow:inset 0 0 0 3px var(--right)}
.scroll{overflow-x:auto;max-width:100%}
img.px{image-rendering:pixelated;display:block;border:1px solid var(--ink)}
img.real{display:block;max-width:100%;height:auto;border:1px solid var(--ink);background:var(--ink)}
.formula{font-size:var(--t-s);background:var(--tint);padding:8px 12px;border-radius:var(--r);overflow-wrap:break-word}
.meta{font-size:var(--t-s);color:var(--ink-2);margin-top:24px}
.stem{font-size:var(--t-l);font-weight:700;line-height:1.3;margin:4px 0 0;white-space:pre-wrap}
.in1{border:1.5px solid var(--ink);border-radius:var(--r);padding:8px 12px;min-height:44px;width:min(100%,260px);font-variant-numeric:tabular-nums}
.fl{display:grid;grid-template-columns:minmax(0,auto) 120px auto;gap:8px 12px;align-items:center;margin-top:12px;justify-content:start}
.fl .in1{width:120px}
fieldset{border:0;margin:16px 0 0;padding:0;min-width:0}legend{padding:0;font-weight:700;font-size:var(--t-s)}
.o{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 12px;padding:12px 0;border-top:1px solid var(--hair);cursor:pointer}
.o input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ink)}
.o small,.mk{display:block;font-weight:700;font-size:var(--t-xs)}
.good{color:var(--right)}.poor{color:var(--wrong)}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 0;border-top:1px solid var(--hair)}
.mrow b{min-width:1.2em}
.fb{margin-top:24px;border-top:1.5px solid var(--ink);padding-top:8px}
.verdict{display:flex;align-items:center;gap:8px;font-size:var(--t-l);font-weight:800}
.card{border-top:1px solid var(--hair);padding:16px 0}
.card h3{margin-top:0}
.card .acts{margin-top:8px;align-items:center}
.card button{padding:8px 16px}
.tag{font-weight:700}
.note{background:var(--tint);padding:12px;border-radius:var(--r);font-size:var(--t-s);margin-top:12px}
.rules table{font-variant-numeric:tabular-nums;border-collapse:collapse;font-size:var(--t-s);margin:12px 0;display:block;overflow-x:auto}
.rules td,.rules th{border-bottom:1px solid var(--hair);padding:8px 16px 8px 0;text-align:left;vertical-align:top}
.rules th{border-bottom:1.5px solid var(--ink)}
.rules li{margin:8px 0}
.total{font-size:var(--t-xl);font-weight:800;margin:16px 0 4px;font-variant-numeric:tabular-nums}
.foot{margin-top:64px;border-top:1px solid var(--hair);padding-top:16px;font-size:var(--t-s);color:var(--ink-2)}
.foot .gh{display:inline-flex;align-items:center;gap:8px;vertical-align:bottom}
@media print{button,.foot,.top{display:none}main{max-width:none}}
</style>

<body>
<main id="app"></main>
<noscript><p style="padding:20px">This page builds its questions with JavaScript. Turn JavaScript on to use it.</p></noscript>
<script>
/*GENS*/
</script>
<script>
"use strict";
const WEEKS = { 1: "Basic Image Representation", 2: "Basic Image Statistics", 3: "Histograms and Thresholding", 4: "Contrast Manipulation", 5: "Morphological Operators", 6: "Rotation and Scaling", 7: "Non-linear Filters", 8: "Linear Filters", 9: "Edge Detection and Cross Correlation", 10: "Steganography", 11: "Spatial Frequency Domain Operations" };
const UNSEEN = { 10: "Quiz 10 was still locked on Canvas when this page was built. These question types come from the Week 10 reading, so the real quiz may ask things that are not here.", 11: "Quiz 11 was still locked on Canvas when this page was built. These question types come from the Week 11 reading, so the real quiz may ask things that are not here." };
const RULES = `
<h2>Read the last line of the question first</h2>
<ul>
<li><b>Coordinates are (i,j).</b> That is row, then column, counting from 1 at the top-left. It is not (x,y).</li>
<li><b>"Round .5 upwards"</b> means 2.5 becomes 3. The symbol ⌈x⌋ means round to the nearest whole number. ⌈x⌉ means always round up.</li>
<li><b>Round, never chop.</b> 215.77 is 216. Typing 215 loses the mark.</li>
<li><b>8-bit results stay inside 0 to 255</b> unless the question asks for the raw or full value. 224 + 60 is stored as 255. 30 − 40 is stored as 0.</li>
<li><b>Raw or full value</b> means leave the number alone, even if it is negative or above 255. Sharpen, Laplacian, emboss and unsharp mask questions usually ask for this.</li>
<li><b>Whole-number boxes are marked exactly.</b> Calculated answers with decimals have a small margin, but do not rely on it.</li>
</ul>
<h2>Windows and kernels</h2>
<ul>
<li>A 3 × 3 window centred at (i,j) covers rows i−1 to i+1 and columns j−1 to j+1. A 5 × 5 window covers i−2 to i+2 and j−2 to j+2. Box it on the matrix before you calculate.</li>
<li>Skip every zero in a kernel. Most 3 × 3 kernels only need four or five numbers.</li>
<li><b>Largest possible output</b> = 255 × the sum of the positive coefficients. Smallest = 255 × the sum of the negative coefficients.</li>
<li>Blur kernels (mean, Gaussian) add up to 1, so brightness is kept and the largest output is 255. Edge kernels add up to 0, so a flat area gives 0. Sharpen adds up to 1 but has a 5 in it, so it can reach 1,275.</li>
</ul>
<h2>When the kernel flip matters</h2>
<p>Convolution turns the kernel through 180° before using it. Cross correlation uses it as printed. Turning through 180° means reversing the order of all the numbers.</p>
<table>
<tr><th>Kernel</th><th>After the 180° turn</th><th>Does the answer change?</th></tr>
<tr><td>Mean, Gaussian, sharpen, Laplacian</td><td>Identical</td><td>No. Use it as printed.</td></tr>
<tr><td>Sobel, Prewitt, Roberts cross</td><td>Every sign reversed</td><td>Gx and Gy both change sign. Magnitude and arctan(Gy ÷ Gx) come out the same.</td></tr>
<tr><td>Kirsch compass</td><td>Becomes another kernel in the bank</td><td>No. The largest of the eight is the same.</td></tr>
<tr><td>Emboss</td><td>The +1 and −1 swap corners</td><td>Yes. The sign of the answer reverses.</td></tr>
<tr><td>Any kernel with no symmetry, such as 1 to 9</td><td>Different</td><td>Yes. Write the turned kernel down first.</td></tr>
</table>
<p>A quick test: turn the page upside down. If the kernel reads the same, the flip does nothing.</p>
<h2>Checks that catch a wrong answer</h2>
<ul>
<li>Distances: chessboard ≤ Euclidean ≤ city block.</li>
<li>Means: harmonic ≤ geometric ≤ arithmetic, and all three sit between the smallest and largest pixel.</li>
<li>Normalised range and Michelson contrast sit between 0 and 1.</li>
<li>Histogram counts add up to MN. The last cumulative bar is MN. The last normalised cumulative bar is 1.</li>
<li>Stretch and equalisation both send the darkest level to 0 and the brightest to 255.</li>
<li>|A ∪ B| = |A| + |B| − |A ∩ B|.</li>
<li>Dilation never removes a pixel and erosion never adds one. Opening fits inside A, and A fits inside closing.</li>
<li>Bilinear weights add up to 1, and the answer lies between the smallest and largest corner.</li>
<li>Min, median and max of a window come out in that order. The midpoint lies between min and max.</li>
<li>LSB embedding moves a pixel by 1 at most.</li>
</ul>
<h2>Calculator habits</h2>
<ul>
<li>log2(v) = log(v) ÷ log(2).</li>
<li>Geometric mean: add up ln of each pixel, divide by the count, then press e to the power of that.</li>
<li>Set degrees, not radians, before any arctan.</li>
<li>Store a coefficient such as 255 ÷ (Lmax − Lmin) once and reuse it for every grey level.</li>
</ul>`;

const LS = "ip-quiz-1", $ = s => document.querySelector(s), app = $("#app");
let st = { t: {} };
try { st = JSON.parse(localStorage.getItem(LS)) || st; } catch (e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const gen = id => GENS.find(g => g.id === id);
const TICK = `<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="3"/></svg>`;
const CROSS = `<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="3"/></svg>`;
const FOOT = `<footer class="foot"><p>Created by <a href="https://www.ibrahimuthman.me/">Ibrahim Uthman</a>. If it helped, <a class="gh" href="https://github.com/IbdotBoss/ip-quiz">star it on GitHub<svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a></p></footer>`;

/* ---------- drawing ---------- */
const cellStyle = (v, kind) => {
  if (kind === "grey" && typeof v === "number") return `background:rgb(${v},${v},${v});color:${v < 140 ? "#fff" : "#17171c"}`;
  if (kind === "bin" && typeof v === "number") return v ? "background:#fff;color:#17171c" : "background:#17171c;color:#fff";
  return "";
};
const matHTML = (m, kind = "plain", mark, half = 1) => `<div class="scroll"><table class="mx ${kind === "k" ? "k" : ""}"><tbody>` + m.map((r, i) => "<tr>" + r.map((v, j) => {
  const inside = mark && Math.abs(i + 1 - mark[0]) <= half && Math.abs(j + 1 - mark[1]) <= half;
  return `<td${inside ? ' class="in"' : ""} style="${cellStyle(v, kind)}">${esc(typeof v === "number" && !Number.isInteger(v) ? Math.round(v * 1000) / 1000 : v)}</td>`;
}).join("") + "</tr>").join("") + "</tbody></table></div>";
const pxImg = (px, label) => {
  const h = px.length, w = px[0].length, c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"), d = x.createImageData(w, h);
  px.flat().forEach((v, n) => { const [r, g, b] = Array.isArray(v) ? v : [v, v, v]; d.data.set([r, g, b, 255], n * 4); });
  x.putImageData(d, 0, 0);
  const s = Math.max(1, Math.floor(132 / Math.max(w, h)));
  return `<img class="px" src="${c.toDataURL()}" width="${w * s}" height="${h * s}" alt="${esc(label || "picture")}">`;
};
const IMG = "/*IMG*/";
const realImg = (it, label) => `<img class="real" src="${IMG}${it.img}.jpg" width="${it.w}" height="${it.h}" alt="${esc(label || "Picture")}" loading="lazy">`;
const vis = (it, label) => it.img ? realImg(it, label) : it.px ? pxImg(it.px, label) : it.svg ? it.svg : it.m ? matHTML(it.m, it.kind, it.mark, it.half) : "";
const figs = show => !show || !show.length ? "" : `<div class="figs">` + show.map(it => `<figure>${it.cap ? `<figcaption>${esc(it.cap)}</figcaption>` : ""}${vis(it, it.cap)}</figure>`).join("") + `</div>`;

/* ---------- pages ---------- */
function page(html, focus = "h1") { app.innerHTML = html + FOOT; window.scrollTo(0, 0); const h = app.querySelector(focus); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }
const shade = id => { const t = st.t[id]; if (!t) return null; const v = Math.round(25 + 230 * t[0] / t[1]); return `rgb(${v},${v},${v})`; };
const scoreText = id => { const t = st.t[id]; return t ? `${t[0]} right out of ${t[1]} tried` : "not tried yet"; };

function home() {
  const rows = Object.keys(WEEKS).map(w => {
    const gs = GENS.filter(g => g.w == w);
    return `<div class="wk"><button data-week="${w}"><b>${w}</b><span>${WEEKS[w]}</span></button><div class="sq">` + gs.map(g => {
      const c = shade(g.id);
      return `<button data-one="${g.id}" ${c ? `style="background:${c}"` : 'class="new"'} title="${esc(g.name)}: ${scoreText(g.id)}" aria-label="Week ${w}, ${esc(g.name)}, ${scoreText(g.id)}. Practise this type."></button>`;
    }).join("") + `</div></div>`;
  }).join("");
  page(`<h1>Image Processing test practice</h1>
<p>MOD002643 in-class test. The weekly quizzes change their numbers on every attempt, so this page does too. Each question shows the quick method, a way to check the answer, and the mistake to avoid.</p>
<div class="acts"><button class="p" data-mixed>Mixed paper, 22 questions</button><button data-rules>Rules for every week</button></div>
<h2>Weeks</h2>
<p class="s">Each square is one type of question, shaded by how many of your answers were right. Select a square to practise that type, or a week name for its cheatsheet.</p>
${rows}
<div class="key"><i class="nw"></i> not tried yet <i class="k0"></i> no answers right <i class="k1"></i> half the answers right <i class="k2"></i> every answer right</div>
<div class="acts"><button class="l" data-reset>Clear my scores</button></div>`);
}

function week(w) {
  const gs = GENS.filter(g => g.w == w);
  page(`<div class="top"><button class="l" data-home>Home</button><span>Week ${w} of 11</span></div>
<h1>Week ${w}: ${WEEKS[w]}</h1>
${UNSEEN[w] ? `<p class="note">${UNSEEN[w]}</p>` : ""}
<div class="acts"><button class="p" data-weekrun="${w}">Practise this week, ${gs.length} questions</button><button data-rules>Rules for every week</button></div>
<h2>Cheatsheet</h2>` + gs.map(g => `<section class="card"><h3>${esc(g.name)}</h3><p><span class="tag">Quick method.</span> ${esc(g.rule)}</p><p><span class="tag">Watch for.</span> ${esc(g.trap)}</p><div class="acts"><button data-one="${g.id}">Try one</button><span class="s">${scoreText(g.id)}</span></div></section>`).join("") +
    `<div class="acts">${w > 1 ? `<button data-week="${w - 1}">Week ${w - 1}</button>` : ""}${w < 11 ? `<button data-week="${+w + 1}">Week ${+w + 1}</button>` : ""}</div>`);
}

function rules() {
  page(`<div class="top"><button class="l" data-home>Home</button><span>All weeks</span></div><h1>Rules for every week</h1><div class="rules">${RULES}</div><div class="acts"><button data-home>Home</button><button data-print>Print this page</button></div>`);
}

/* ---------- a run of questions ---------- */
let run = null, q = null;
function start(ids, title, back) { run = { ids, title, back, i: 0, right: 0, done: [] }; ask(); }
function ask() { const g = gen(run.ids[run.i]); q = { g, ...g.make(), checked: false }; q.inputs = [].concat(q.input); drawQ(); }

const inputHTML = (inp, n) => {
  const cap = inp.cap ? `<legend>${esc(inp.cap)}</legend>` : `<legend class="s">${{ num: "Your answer", text: "Your answer", grid: "Enter the output", fields: "Fill in each box", mc: "Choose one", multi: "Choose every one that applies", match: "Choose a match for each" }[inp.k]}</legend>`;
  let h = "";
  if (inp.k === "num" || inp.k === "text") h = `<input class="in1" data-i="${n}" type="text" ${inp.k === "num" ? 'inputmode="decimal"' : 'autocapitalize="characters"'} autocomplete="off" spellcheck="false" aria-label="Your answer" style="margin-top:8px">`;
  if (inp.k === "grid") h = `<div class="scroll" style="margin-top:8px"><table class="mx"><tbody>` + inp.ans.map((r, i) => "<tr>" + r.map((_, j) => `<td class="io"><input data-i="${n}" data-r="${i}" data-c="${j}" type="text" inputmode="decimal" autocomplete="off" aria-label="Row ${i + 1}, column ${j + 1}"></td>`).join("") + "</tr>").join("") + `</tbody></table></div>`;
  if (inp.k === "fields") h = `<div class="fl">` + inp.labels.map((l, f) => `<label for="f${n}-${f}">${esc(l)}</label><input class="in1" id="f${n}-${f}" data-i="${n}" data-f="${f}" type="text" inputmode="decimal" autocomplete="off"><span class="mk" data-m="${n}-${f}"></span>`).join("") + `</div>`;
  if (inp.k === "mc" || inp.k === "multi") h = inp.opts.map((o, k) => `<label class="o"><input type="${inp.k === "mc" ? "radio" : "checkbox"}" name="i${n}" data-i="${n}" value="${k}"><span>${esc(o)}<small data-m="${n}-${k}"></small></span></label>`).join("");
  if (inp.k === "match") h = inp.left.map((l, k) => `<div class="mrow">${l.px || l.svg || l.img ? `<b>${esc(l.t)}</b>${vis(l, "Picture " + l.t)}` : `<span>${esc(l.t)}</span>`}<select data-i="${n}" data-f="${k}" aria-label="Match for ${esc(l.t)}"><option value="">Choose</option>${inp.opts.map((o, x) => `<option value="${x}">${esc(o)}</option>`).join("")}</select><span class="mk" data-m="${n}-${k}"></span></div>`).join("");
  return `<fieldset>${cap}${h}</fieldset>`;
};

function drawQ() {
  const g = q.g;
  page(`<div class="top"><button class="l" data-back>${run.back === "home" ? "Home" : "Week " + g.w}</button><span>${esc(run.title)}${run.ids.length > 1 ? `, question ${run.i + 1} of ${run.ids.length}` : ""}</span></div>
<p class="meta">Week ${g.w}. ${esc(g.name)}</p>
<h1 class="stem">${esc(q.stem)}</h1>
${figs(q.show)}
${q.formula ? `<p class="formula">${esc(q.formula)}</p>` : ""}
<form id="f" novalidate>${q.inputs.map(inputHTML).join("")}
<div class="acts"><button class="p" type="submit">Check answer</button><button type="button" data-hint>Show the quick method</button></div></form>
<div id="hint" class="note" hidden><b>Quick method.</b> ${esc(g.rule)}</div>
<div id="fb" class="fb" aria-live="polite" hidden></div>`, "h1");
}

const parse = s => { s = String(s).replace(/[,\s]/g, "").replace("−", "-"); return s === "" || isNaN(s) ? null : Number(s); };
const numOK = (inp, raw) => {
  if (typeof inp.ans === "string") return String(raw).replace(/[,\s]/g, "").replace(/^0+(?=\d)/, "") === inp.ans.replace(/^0+(?=\d)/, "");
  const v = parse(raw); return v !== null && Math.abs(v - inp.ans) <= (inp.tol || 0) + 1e-9;
};
const show = v => typeof v === "number" ? v.toLocaleString("en-GB", { maximumFractionDigits: 4 }) : typeof v === "string" && /^\d{5,}$/.test(v) && !/^[01]{8}$/.test(v) ? v.replace(/\B(?=(\d{3})+(?!\d))/g, ",") : v;

function check() {
  if (q.checked) return;
  let all = true; const out = [];
  q.inputs.forEach((inp, n) => {
    const els = [...app.querySelectorAll(`[data-i="${n}"]`)];
    const mark = (key, ok, right) => { const m = app.querySelector(`[data-m="${n}-${key}"]`); if (m) { m.className = (m.tagName === "SMALL" ? "" : "mk ") + (ok ? "good" : "poor"); m.textContent = ok ? "Right" : "Wrong. It is " + right; } };
    if (inp.k === "num") { const ok = numOK(inp, els[0].value); all = all && ok; out.push(`${ok ? "" : "You entered " + esc(els[0].value || "nothing") + ". "}The answer is <b>${esc(show(inp.ans))}</b>.`); }
    if (inp.k === "text") { const ok = els[0].value.trim().toUpperCase() === inp.ans; all = all && ok; out.push(`The answer is <b>${esc(inp.ans)}</b>.`); }
    if (inp.k === "grid") {
      let bad = 0;
      els.forEach(e => { const i = +e.dataset.r, j = +e.dataset.c, v = parse(e.value), ok = v !== null && (inp.any ? inp.any[i][j].includes(v) : Math.abs(v - inp.ans[i][j]) <= (inp.tol || 0) + 1e-9); e.parentNode.classList.add(ok ? "ok" : "bad"); if (!ok) bad++; });
      all = all && !bad;
      out.push(`${inp.cap ? esc(inp.cap) + ". " : ""}${bad ? bad + " of " + els.length + " boxes are wrong. " : ""}The ${inp.any ? "usual " : ""}answer is:${matHTML(inp.ans, "plain")}`);
    }
    if (inp.k === "fields") els.forEach(e => { const f = +e.dataset.f, v = parse(e.value), ok = v !== null && Math.abs(v - inp.ans[f]) <= (inp.tol || 0) + 1e-9; all = all && ok; mark(f, ok, show(inp.ans[f])); });
    if (inp.k === "mc") { const pick = els.find(e => e.checked), ok = !!pick && +pick.value === inp.ans; all = all && ok; if (pick && !ok) mark(pick.value, false, "not this one"); const m = app.querySelector(`[data-m="${n}-${inp.ans}"]`); m.className = "good"; m.textContent = ok ? "Right" : "This is the right answer"; if (pick && !ok) app.querySelector(`[data-m="${n}-${pick.value}"]`).textContent = "Wrong"; }
    if (inp.k === "multi") els.forEach(e => { const k = +e.value, want = inp.ans[k], ok = e.checked === want; all = all && ok; const m = app.querySelector(`[data-m="${n}-${k}"]`); if (want) { m.className = "good"; m.textContent = e.checked ? "Right" : "This is a right answer"; } else if (e.checked) { m.className = "poor"; m.textContent = "Wrong"; } });
    if (inp.k === "match") els.forEach(e => { const f = +e.dataset.f, ok = e.value !== "" && +e.value === inp.ans[f]; all = all && ok; mark(f, ok, inp.opts[inp.ans[f]]); });
    els.forEach(e => e.disabled = true);
  });
  q.checked = true;
  const t = st.t[q.g.id] || [0, 0]; t[1]++; if (all) t[0]++; st.t[q.g.id] = t; save();
  if (all) run.right++;
  const last = run.i === run.ids.length - 1, prompt = encodeURIComponent(aiPrompt());
  const fb = $("#fb"); fb.hidden = false; $("#hint").hidden = true; app.querySelector("[type=submit]").hidden = true; app.querySelector("[data-hint]").hidden = true;
  fb.innerHTML = `<p class="verdict ${all ? "good" : "poor"}">${all ? TICK + "Right" : CROSS + "Not right"}</p>
${out.map(o => `<div>${o}</div>`).join("")}
${q.steps.length ? `<h2>Working</h2><ol>${q.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}
<p><span class="tag">Quick method.</span> ${esc(q.g.rule)}</p>
<p><span class="tag">Watch for.</span> ${esc(q.g.trap)}</p>
<div class="acts"><button class="p" data-next>${run.ids.length === 1 ? "Another like this" : last ? "See my score" : "Next question"}</button>${run.ids.length > 1 ? `<button data-again>Another like this</button>` : ""}</div>
<p class="s">Still unclear? Ask an assistant about this question: <a href="https://claude.ai/new?q=${prompt}" target="_blank" rel="noopener">Claude</a> or <a href="https://chatgpt.com/?q=${prompt}" target="_blank" rel="noopener">ChatGPT</a>. Both open in a new tab with the question filled in.</p>`;
  fb.querySelector("[data-next]").focus();
}
const aiPrompt = () => {
  const mats = (q.show || []).filter(s => s.m).map(s => (s.cap ? s.cap + " = " : "") + "[" + s.m.map(r => r.join(" ")).join("; ") + "]").join("\n");
  const ans = q.inputs.map(i => i.k === "mc" ? i.opts[i.ans] : i.k === "match" ? i.left.map((l, k) => l.t + " = " + i.opts[i.ans[k]]).join(", ") : i.k === "multi" ? i.opts.filter((o, k) => i.ans[k]).join("; ") : JSON.stringify(i.ans)).join(" and ");
  return `I am revising for a university image processing test. Coordinates are (row, column) from 1, and ".5 rounds upwards". Explain step by step how to answer this, and why the method works.\n\nQuestion: ${q.stem}\n${mats}\n${q.formula || ""}\nGiven answer: ${ans}`.slice(0, 1800);
};

function summary() {
  page(`<div class="top"><button class="l" data-home>Home</button><span>${esc(run.title)}</span></div><h1>${esc(run.title)}: your score</h1>
<p class="total">${run.right} right out of ${run.ids.length}</p>
<h2>Question types to look at again</h2>` + (run.done.some(d => !d.ok) ? run.done.filter(d => !d.ok).map(d => `<section class="card"><h3>Week ${gen(d.id).w}. ${esc(gen(d.id).name)}</h3><p>${esc(gen(d.id).rule)}</p><div class="acts"><button data-one="${d.id}">Try one</button></div></section>`).join("") : `<p>None. Every answer was right.</p>`) +
    `<div class="acts"><button class="p" data-home>Home</button><button data-mixed>Another mixed paper</button></div>`);
}

const mixed = () => start(Object.keys(WEEKS).flatMap(w => shuffleA(GENS.filter(g => g.w == w)).slice(0, 2).map(g => g.id)), "Mixed paper", "home");
const shuffleA = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

app.addEventListener("submit", e => { e.preventDefault(); check(); });
app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if ("home" in d) home();
  else if ("rules" in d) rules();
  else if ("print" in d) window.print();
  else if (d.week) week(d.week);
  else if (d.one) start([d.one], "Practising one question type", gen(d.one).w);
  else if (d.weekrun) start(GENS.filter(g => g.w == d.weekrun).map(g => g.id), "Week " + d.weekrun, d.weekrun);
  else if ("mixed" in d) mixed();
  else if ("hint" in d) { $("#hint").hidden = false; b.hidden = true; }
  else if ("back" in d) run.back === "home" ? home() : week(run.back);
  else if ("again" in d) ask();
  else if ("next" in d) {
    if (run.ids.length === 1) return ask();
    run.done.push({ id: q.g.id, ok: st.t[q.g.id] && q.checked && app.querySelector(".verdict").classList.contains("good") });
    run.i++; run.i < run.ids.length ? ask() : summary();
  }
  else if ("reset" in d) { const dlg = document.createElement("dialog"); dlg.innerHTML = `<p>Clear every score on this device?</p><div class="acts"><button class="p" value="yes">Clear scores</button><button value="no">Keep them</button></div>`; document.body.append(dlg); dlg.addEventListener("click", ev => { const v = ev.target.value; if (!v) return; if (v === "yes") { st = { t: {} }; save(); } dlg.close(); dlg.remove(); home(); }); dlg.showModal(); }
});
home();
</script>
</body>
</html>
