<h2 id="r-answer">Typing the answer</h2>
<p>Read the last line of the question first. It says how to round and whether to clip.</p>
<ul>
<li><b>Round, never chop.</b> 215.77 is 216. Typing 215 loses the mark.</li>
<li><b>Round once, at the end.</b> Keep the full value on the calculator until the last step.</li>
<li><b>8-bit results stay inside 0 to 255</b> unless the question asks for the raw or full value. 224 + 60 is stored as 255. 30 − 40 is stored as 0.</li>
<li><b>Raw or full value</b> means leave the number alone, even if it is negative or above 255. Sharpen, Laplacian, emboss and unsharp mask questions usually ask for this.</li>
<li><b>Whole-number boxes are marked exactly.</b> Decimal answers have a small margin, but do not rely on it.</li>
<li><b>No comma in a number box.</b> Type 6060.11, not 6,060.11.</li>
</ul>
<h2 id="r-windows">Windows and kernels</h2>
<ul>
<li>A 3 × 3 window centred at (i,j) covers rows i−1 to i+1 and columns j−1 to j+1. A 5 × 5 window covers i−2 to i+2 and j−2 to j+2. Box the window on the matrix before you calculate.</li>
<li>Skip every zero in a kernel. Most 3 × 3 kernels only need four or five numbers.</li>
<li><b>Largest possible output</b> = 255 × the sum of the positive coefficients. Smallest = 255 × the sum of the negative coefficients.</li>
<li>Blur kernels (mean, Gaussian) add up to 1, so brightness is kept and the largest output is 255. Edge kernels add up to 0, so a flat area gives 0. Sharpen adds up to 1 but has a 5 in it, so it can reach 1,275.</li>
<li>The kernels themselves are on the <a href="#/ref">look-up page</a>.</li>
</ul>
<h2 id="r-flip">When the kernel flip matters</h2>
<p>Convolution turns the kernel through 180° before using it. Cross correlation uses it as printed. Turning through 180° means reversing the order of all the numbers.</p>
<table>
<tr><th>Kernel</th><th>After the 180° turn</th><th>Does the answer change?</th></tr>
<tr><td>Mean, Gaussian, sharpen, Laplacian</td><td>Identical</td><td>No. Use it as printed.</td></tr>
<tr><td>Sobel, Prewitt, Roberts cross</td><td>Every sign reversed</td><td>Gx and Gy both change sign. Magnitude and arctan(Gy ÷ Gx) come out the same.</td></tr>
<tr><td>Kirsch compass</td><td>Becomes another kernel in the set of eight</td><td>No. The largest of the eight is the same.</td></tr>
<tr><td>Emboss</td><td>The +1 and −1 swap corners</td><td>Yes. The sign of the answer reverses.</td></tr>
<tr><td>Any kernel with no symmetry, such as 1 to 9</td><td>Different</td><td>Yes. Write the turned kernel down first.</td></tr>
</table>
<p>A quick test: turn the page upside down. If the kernel reads the same, the flip does nothing.</p>
<h2 id="r-checks">Checks that catch a wrong answer</h2>
<ul>
<li>Distances: chessboard ≤ Euclidean ≤ city block.</li>
<li>Means: harmonic ≤ geometric ≤ arithmetic, and all three sit between the smallest and largest pixel.</li>
<li>Normalised range and Michelson contrast sit between 0 and 1.</li>
<li>Histogram counts add up to MN. The last cumulative bar is MN. The last normalised cumulative bar is 1.</li>
<li>Stretch and equalisation both send the darkest level to 0 and the brightest to 255.</li>
<li>|A ∪ B| = |A| + |B| − |A ∩ B|.</li>
<li>Dilation never removes a pixel and erosion never adds one. Opening fits inside A, and A fits inside closing.</li>
<li>Bilinear weights add up to 1, and the answer lies between the smallest and largest corner.</li>
<li>Min, median and max of a window come out in that order. The midpoint lies between min and max.</li>
<li>LSB embedding moves a pixel by 1 at most.</li>
</ul>
<h2 id="r-calc">Calculator habits</h2>
<ul>
<li>log2(v) = log(v) ÷ log(2).</li>
<li>Standard deviation and RMS contrast: enter the pixels in statistics mode and read σx. Do not read sx, which divides by MN − 1.</li>
<li>Geometric mean: add up ln of each pixel, divide by the count, then press e to the power of that.</li>
<li>Set degrees, not radians, before any arctan.</li>
<li>Store a coefficient such as 255 ÷ (Lmax − Lmin) once and reuse it for every grey level.</li>
</ul>`;

/* ---------- drawing ---------- */
const cellStyle = (v, kind) => {
  if (kind === "grey" && typeof v === "number") return `background:rgb(${v},${v},${v});color:${v < 140 ? "#fff" : "#17171c"}`;
  if (kind === "bin" && typeof v === "number") return v ? "background:#fff;color:#17171c" : "background:#17171c;color:#fff";

// Sets a line of maths: single letters in italic, _x as a subscript, ^x as a superscript.
const mathHTML = s => esc(s)
  .replace(/_\{?(\w+)\}?/g, "\u0001$1\u0002").replace(/\^\{?(-?\w+)\}?/g, "\u0003$1\u0004")
  .replace(/&\w+;|[A-Za-z\u0370-\u03ff]+′?/g, w => w[0] === "&" ? w : /^[GkL][xy]$/.test(w) ? `<i>${w[0]}</i>\u0001<i>${w[1]}</i>\u0002` : (w.replace("′", "").length === 1 || /^[A-Z]{2,3}′?$/.test(w)) ? `<i>${w}</i>` : w)
  .replace(/\u0001/g, "<sub>").replace(/\u0002/g, "</sub>").replace(/\u0003/g, "<sup>").replace(/\u0004/g, "</sup>");
// Finds the bits of maths inside a sentence, such as (2,3), 3×3 and L′(i,j) = L(i,j).

const SYMBOL = /^[A-Za-z]{1,2}[₀-₉]?(\(\d\))?$/;
const capHTML = c => SYMBOL.test(c) ? `<span class="m">${mathHTML(c.replace(/[₀-₉]/, d => "_" + "₀₁₂₃₄₅₆₇₈₉".indexOf(d)).replace(/\((\d)\)$/, "^{($1)}").replace(/\^\{\((\d)\)\}/, "\u0003($1)\u0004")).replace(/\u0003/g, "<sup>").replace(/\u0004/g, "</sup>")}</span>` : esc(c);
const cell = v => typeof v === "number" && !Number.isInteger(v) ? Math.round(v * 10000) / 10000 : v;
const frac = v => { const f = String(v).match(/^(-?\d+)\/(\d+)$/); return f ? `<span class="fr"><span>${f[1]}</span><span>${f[2]}</span></span>` : esc(String(cell(v)).replace(/^-/, "−")); };
const matHTML = (m, kind = "plain", mark, half = 1) => kind === "k"
  ? `<span class="br m"><table><tbody>` + m.map(r => "<tr>" + [].concat(r).map(v => `<td>${frac(v)}</td>`).join("") + "</tr>").join("") + `</tbody></table></span>`
  : `<div class="scroll"><table class="mx"><tbody>` + m.map((r, i) => "<tr>" + [].concat(r).map((v, j) => {
    const inside = mark && Math.abs(i + 1 - mark[0]) <= half && Math.abs(j + 1 - mark[1]) <= half;
    return `<td${inside ? ' class="in"' : ""} style="${cellStyle(v, kind)}">${esc(cell(v))}</td>`;
  }).join("") + "</tr>").join("") + "</tbody></table></div>";
const pxImg = (px, label) => {
  const h = px.length, w = px[0].length, c = document.createElement("canvas"); c.width = w; c.height = h;

  if (spy) spy.disconnect();
  const bar = $(".strip.stick"); if (!bar || !("IntersectionObserver" in window)) return;
  spy = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    bar.querySelectorAll("[aria-current]").forEach(a => a.removeAttribute("aria-current"));
    const a = bar.querySelector(`[data-n="${e.target.dataset.n}"]`); if (!a) return;
    a.setAttribute("aria-current", "true");
    bar.scrollLeft = a.offsetLeft - bar.clientWidth / 2 + a.offsetWidth / 2;
  }), { rootMargin: "-90px 0px -65% 0px" });
  app.querySelectorAll(".card[data-n]").forEach(c => spy.observe(c));
}

const toc = secs => `<nav class="toc" aria-label="On this page">${secs.map(([id, h]) => `<button type="button" data-jump="${id}">${h}</button>`).join("")}</nav>`;
function rules() {
  here = "rules";
  page(head("Rules for every week", `<a href="#/">All quizzes</a><a href="#/ref">Look-up</a>`) + `<p>What the wording of a question means, and the checks that catch a wrong answer before you hand it in.</p>` + toc(RULE_SECS) + `<div class="rules">${RULES}</div>` + pager(`<a class="btn" href="#/">All quizzes</a><a class="btn" href="#/ref">Look-up tables</a>`, `<button type="button" data-print>Print this page</button>`), true);
}

const lookFig = ([imgs, name, tell]) => `<figure>${[].concat(imgs).length > 1 ? `<div class="pair">` : ""}${[].concat(imgs).map(p => { const s = PIC[p] || ["", 120, 120]; return `<img class="real" src="${IMG}${p}.jpg" width="${s[1]}" height="${s[2]}" alt="${esc(name)}" loading="lazy">`; }).join("")}${[].concat(imgs).length > 1 ? `</div>` : ""}<figcaption><b>${esc(name)}</b>${inl(tell)}</figcaption></figure>`;
const kernFig = ([name, mats, note]) => `<div><h3>${esc(name)}</h3><div class="figs">${mats.map(([cap, m]) => `<span class="bm">${cap ? capHTML(cap) + `<span class="m">=</span>` : ""}${matHTML(m, "k")}</span>`).join("")}</div><p>${inl(note)}</p></div>`;
function ref() {
  here = "ref";
  const secs = [["colours", "Colours"]].concat(LOOK.map(s => [s.id, s.h]), [["kernels", "Kernels"]]);
  page(head("Look-up tables", `<a href="#/">All quizzes</a><a href="#/rules">Rules</a>`) + `<p>The facts and pictures you have to recognise, in one place: colours, the tutor's quiz pictures named by what they show, and every kernel.</p>` + toc(secs) + `
<div class="rules">
<h2 id="colours">Colours as (red, green, blue)</h2>
<p>One channel at 255 is a primary colour. Two channels at 255 make a secondary colour. Three equal channels make a grey.</p>
<table><tr><th></th><th>Colour</th><th>(R, G, B)</th><th>How to remember it</th></tr>${COLOURS.map(([n, r, g, b, why]) => `<tr><td><span class="sw" style="background:rgb(${r},${g},${b})"></span></td><td>${n}</td><td><span class="m">(${r}, ${g}, ${b})</span></td><td>${why}</td></tr>`).join("")}</table>
<p>From <a href="#/q/1/15">Quiz 01, Question 15</a>.</p>
</div>
${LOOK.map(s => `<h2 id="${s.id}">${s.h}</h2><p>${inl(s.p)}</p><div class="look${s.wide ? " wide" : ""}">${s.items.map(lookFig).join("")}</div>${s.table || ""}<p>From ${s.from}.</p>`).join("")}
<h2 id="kernels">Kernels</h2>
<p>Largest possible output = 255 × the sum of the positive coefficients. "Flip" says what happens when convolution turns the kernel through 180°.</p>
<div class="kern">${KERNELS.map(kernFig).join("")}</div>` + pager(`<a class="btn" href="#/">All quizzes</a><a class="btn" href="#/rules">Rules</a>`, `<button type="button" data-print>Print this page</button>`));
}

/* ---------- one question with new numbers ---------- */
let q = null, from = null;
function tryOne(id, ref) {
  here = "try"; const [w, n] = String(ref || "").split("-"); from = { w: +w || gen(id).w, n: +n || 0 };
  ask(id);
}
function ask(id) { const g = gen(id); q = { g, ...g.make(), checked: false }; q.inputs = [].concat(q.input); drawQ(); }
const backHref = () => `#/q/${from.w}${from.n ? "/" + from.n : ""}`;
const backText = () => from.n ? `Back to Question ${from.n}` : `Back to Quiz ${two(from.w)}`;

const inputHTML = (inp, n) => {
  const cap = inp.cap ? `<legend>${esc(inp.cap)}</legend>` : `<legend class="s">${{ num: "Your answer", text: "Your answer", grid: "Enter the output", fields: "Fill in each box", mc: "Choose one", multi: "Choose every one that applies", match: "Choose a match for each" }[inp.k]}</legend>`;
  let h = "";
  if (inp.k === "num" || inp.k === "text") h = `<input class="in1" data-i="${n}" type="text" ${inp.k === "num" ? 'inputmode="decimal"' : 'autocapitalize="characters"'} autocomplete="off" spellcheck="false" aria-label="Your answer" style="margin-top:8px">`;
  if (inp.k === "grid") h = `<div class="scroll" style="margin-top:8px"><table class="mx"><tbody>` + inp.ans.map((r, i) => "<tr>" + r.map((_, j) => `<td class="io"><input data-i="${n}" data-r="${i}" data-c="${j}" type="text" inputmode="decimal" autocomplete="off" aria-label="Row ${i + 1}, column ${j + 1}"></td>`).join("") + "</tr>").join("") + `</tbody></table></div>`;
  if (inp.k === "fields") h = `<div class="fl">` + inp.labels.map((l, f) => `<label for="f${n}-${f}">${esc(l)}</label><input class="in1" id="f${n}-${f}" data-i="${n}" data-f="${f}" type="text" inputmode="decimal" autocomplete="off"><span class="mk" data-m="${n}-${f}"></span>`).join("") + `</div>`;
  if (inp.k === "mc" || inp.k === "multi") h = inp.opts.map((o, k) => `<label class="o"><input type="${inp.k === "mc" ? "radio" : "checkbox"}" name="i${n}" data-i="${n}" value="${k}"><span>${esc(o)}<small data-m="${n}-${k}"></small></span></label>`).join("");
  if (inp.k === "match") h = inp.left.map((l, k) => `<div class="mrow">${l.px || l.svg || l.img ? `<b>${esc(l.t)}</b>${vis(l, "Picture " + l.t)}` : `<span>${esc(l.t)}</span>`}<select data-i="${n}" data-f="${k}" aria-label="Match for ${esc(l.t)}"><option value="">Choose</option>${inp.opts.map((o, x) => `<option value="${x}">${esc(o)}</option>`).join("")}</select><span class="mk" data-m="${n}-${k}"></span></div>`).join("");
  return `<fieldset>${cap}${h}</fieldset>`;
};

function drawQ() {
  const g = q.g;
  page(head(`${from.n ? `Question ${from.n}` : esc(g.name)} <span>${SHUFFLED.includes(g.id) ? "with shuffled letters" : "with new numbers"}</span>`, `<a href="${backHref()}">${backText()}</a>`) + `
<p class="stem">${esc(q.stem)}</p>
${figs(q.show)}
${q.formula ? `<p class="formula m">${mathHTML(q.formula)}</p>` : ""}
<form id="f" novalidate>${q.inputs.map(inputHTML).join("")}
<div class="acts"><button class="p" type="submit">Check answer</button></div></form>
<div id="fb" class="fb" aria-live="polite" hidden></div>`, true);
}

const parse = s => { s = String(s).replace(/[,\s]/g, "").replace("−", "-"); return s === "" || isNaN(s) ? null : Number(s); };
const numOK = (inp, raw) => {
  if (typeof inp.ans === "string") return String(raw).replace(/[,\s]/g, "").replace(/^0+(?=\d)/, "") === inp.ans.replace(/^0+(?=\d)/, "");
  const v = parse(raw); return v !== null && Math.abs(v - inp.ans) <= (inp.tol || 0) + 1e-9;
};
const show = v => typeof v === "number" ? v.toLocaleString("en-GB", { maximumFractionDigits: 4 }) : typeof v === "string" && /^\d{5,}$/.test(v) && !/^[01]{8}$/.test(v) ? v.replace(/\B(?=(\d{3})+(?!\d))/g, ",") : v;

function check() {
  if (q.checked) return;
  let all = true; const out = [];
  q.inputs.forEach((inp, n) => {
    const els = [...app.querySelectorAll(`[data-i="${n}"]`)];
    const mark = (key, ok, right) => { const m = app.querySelector(`[data-m="${n}-${key}"]`); if (m) { m.className = (m.tagName === "SMALL" ? "" : "mk ") + (ok ? "good" : "poor"); m.textContent = ok ? "Right" : "Wrong. It is " + right; } };
    if (inp.k === "num") { const ok = numOK(inp, els[0].value); all = all && ok; out.push(`${ok ? "" : "You entered " + esc(els[0].value || "nothing") + ". "}The answer is <b>${esc(show(inp.ans))}</b>.`); }
    if (inp.k === "text") { const ok = els[0].value.trim().toUpperCase() === inp.ans; all = all && ok; out.push(`The answer is <b>${esc(inp.ans)}</b>.`); }
    if (inp.k === "grid") {
      let bad = 0;
      els.forEach(e => { const i = +e.dataset.r, j = +e.dataset.c, v = parse(e.value), ok = v !== null && (inp.any ? inp.any[i][j].includes(v) : Math.abs(v - inp.ans[i][j]) <= (inp.tol || 0) + 1e-9); e.parentNode.classList.add(ok ? "ok" : "bad"); if (!ok) bad++; });
      all = all && !bad;
      out.push(`${inp.cap ? esc(inp.cap) + ". " : ""}${bad ? bad + " of " + els.length + " boxes are wrong. " : ""}The ${inp.any ? "usual " : ""}answer is:${matHTML(inp.ans, "plain")}`);
    }
    if (inp.k === "fields") els.forEach(e => { const f = +e.dataset.f, v = parse(e.value), ok = v !== null && Math.abs(v - inp.ans[f]) <= (inp.tol || 0) + 1e-9; all = all && ok; mark(f, ok, show(inp.ans[f])); });
    if (inp.k === "mc") { const pick = els.find(e => e.checked), ok = !!pick && +pick.value === inp.ans; all = all && ok; const m = app.querySelector(`[data-m="${n}-${inp.ans}"]`); m.className = "good"; m.textContent = ok ? "Right" : "This is the right answer"; if (pick && !ok) { const p = app.querySelector(`[data-m="${n}-${pick.value}"]`); p.className = "poor"; p.textContent = "Wrong"; } }
    if (inp.k === "multi") els.forEach(e => { const k = +e.value, want = inp.ans[k], ok = e.checked === want; all = all && ok; const m = app.querySelector(`[data-m="${n}-${k}"]`); if (want) { m.className = "good"; m.textContent = e.checked ? "Right" : "This is a right answer"; } else if (e.checked) { m.className = "poor"; m.textContent = "Wrong"; } });
    if (inp.k === "match") els.forEach(e => { const f = +e.dataset.f, ok = e.value !== "" && +e.value === inp.ans[f]; all = all && ok; mark(f, ok, inp.opts[inp.ans[f]]); });
    els.forEach(e => e.disabled = true);
  });
  q.checked = true;
  const prompt = encodeURIComponent(aiPrompt());
  const fb = $("#fb"); fb.hidden = false; app.querySelector("[type=submit]").hidden = true;
  fb.innerHTML = `<p class="verdict ${all ? "good" : "poor"}">${all ? TICK + "Right" : CROSS + "Not right"}</p>
${out.map(o => `<div>${o}</div>`).join("")}
${q.steps.length ? `<h2>Working</h2><ol>${q.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}
<p><b>Method.</b> ${esc(q.g.rule)}</p>
<p><b>Trap.</b> ${esc(q.g.trap)}</p>
<div class="acts"><button class="p" type="button" data-again>Another like this</button><a class="btn" href="${backHref()}">${backText()}</a></div>
<p class="s">Still unclear? Ask an assistant about this question: <a href="https://claude.ai/new?q=${prompt}" target="_blank" rel="noopener">Claude</a> or <a href="https://chatgpt.com/?q=${prompt}" target="_blank" rel="noopener">ChatGPT</a>. Both open in a new tab with the question filled in.</p>`;
  fb.querySelector("[data-again]").focus();
}
const aiPrompt = () => {
  const mats = (q.show || []).filter(s => s.m).map(s => (s.cap ? s.cap + " = " : "") + "[" + s.m.map(r => r.join(" ")).join("; ") + "]").join("\n");
  const ans = q.inputs.map(i => i.k === "mc" ? i.opts[i.ans] : i.k === "match" ? i.left.map((l, k) => l.t + " = " + i.opts[i.ans[k]]).join(", ") : i.k === "multi" ? i.opts.filter((o, k) => i.ans[k]).join("; ") : JSON.stringify(i.ans)).join(" and ");
  return `I am revising for a university image processing test. Coordinates are (row, column) from 1, and ".5 rounds upwards". Explain step by step how to answer this, and why the method works.\n\nQuestion: ${q.stem}\n${mats}\n${q.formula || ""}\nGiven answer: ${ans}`.slice(0, 1800);
};

/* ---------- routing ---------- */
function route() {
  const p = decodeURIComponent(location.hash).replace(/^#\/?/, "").split("/");
  if (p[0] === "q" && WEEKS[p[1]]) quiz(+p[1], p[2]);
  else if (p[0] === "rules") rules();
  else if (p[0] === "ref") ref();
  else if (p[0] === "try" && gen(p[1])) tryOne(p[1], p[2]);
  else home();
}
addEventListener("hashchange", route);
app.addEventListener("submit", e => { e.preventDefault(); check(); });
app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if ("print" in d) window.print();
  else if ("top" in d) { window.scrollTo(0, 0); const h = app.querySelector("h1"); if (h) h.focus({ preventScroll: true }); }
  else if ("jump" in d) { const el = document.getElementById(d.jump); if (el) { el.scrollIntoView(); el.tabIndex = -1; el.focus({ preventScroll: true }); } }
  else if ("again" in d) ask(q.g.id);
  else if ("themeToggle" in d) {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    try { localStorage.setItem("ip-sheet-mode", root.dataset.theme); } catch (err) {}
    b.textContent = root.dataset.theme === "dark" ? "Light mode" : "Dark mode";
  }
});
route();
</script>
</body>
</html>
