:root{
  --body:"Lato","Helvetica Neue",Helvetica,Arial,sans-serif;
  --math:"KaTeX Main","Latin Modern Roman","Cambria Math","Times New Roman",serif;
  --mathi:"KaTeX Math","KaTeX Main","Cambria Math","Times New Roman",serif;
  --t-s:.9375rem;--t-m:1rem;--t-l:1.25rem;--t-xl:1.75rem;--r:4px;--strip:61px;
}
/* Light, "Crib sheet": squared paper, navy ink, a yellow highlighter. */
html[data-theme="light"]{--paper:#fbfbf7;--panel:#fff;--ink:#14213d;--ink-2:#4d5670;--hair:#b3c0d8;--tint:#edf1f7;--mark:#ffe45c;--mark-ink:#14213d;--right:#0c6b3d;--wrong:#b3261e;--focus:#2f5fd0;--nb:#14213d;--nb-ink:#fff;
  --grid:linear-gradient(#dfe7f3 1px,transparent 1px),linear-gradient(90deg,#dfe7f3 1px,transparent 1px)}
/* Dark, "Slide": the black ground of the tutor's slides, with the same yellow. */
html[data-theme="dark"]{--paper:#000;--panel:#111113;--ink:#f2f2f0;--ink-2:#b0b0ab;--hair:#3d3d41;--tint:#1a1a1d;--mark:#ffd84a;--mark-ink:#000;--right:#7be0a4;--wrong:#ff9d94;--focus:#8ab4ff;--nb:#f2f2f0;--nb-ink:#000;--grid:none}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--strip) + 16px)}
html,body{overflow-x:clip}
body{margin:0;background:var(--paper);background-image:var(--grid);background-size:16px 16px;color:var(--ink);font:400 var(--t-m)/1.5 var(--body)}
main{max-width:1180px;margin:0 auto;padding:16px 16px 64px;min-height:100dvh}
main.narrow{max-width:760px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:var(--t-xl);font-weight:700;line-height:1.15}
h1 span,h2 span{color:var(--ink-2);font-weight:400}
h2{font-size:var(--t-l);font-weight:700;line-height:1.25;margin-top:32px}

<body>
<main id="app"></main>
<noscript><p style="padding:20px">This page is built with JavaScript. Turn JavaScript on to use it.</p></noscript>
<script>
// Solvers (S) and question generators (GENS) for the Image Processing practice site.
// Pure data in and out, so node can test it. The page draws what these return.

const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[ri(0, a.length - 1)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rmat = (M, N, lo = 0, hi = 255) => Array.from({ length: M }, () => Array.from({ length: N }, () => ri(lo, hi)));
const sum = a => a.reduce((x, y) => x + y, 0);
const rnd = x => Math.floor(x + 0.5);            // "round .5 upwards"
const clip = x => Math.max(0, Math.min(255, x));
const dp2 = x => Math.round(x * 100) / 100;
const map2 = (m, f) => m.map((r, i) => r.map((v, j) => f(v, i, j)));
const mt = m => "[" + m.map(r => r.join(" ")).join("; ") + "]";
const big = n => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");

const S = {
  // week 1
  bytesBinary: (M, N) => Math.ceil(M * N / 8),
  bytesIndexed: (M, N, C) => M * N + 3 * C,
  minBits: v => { let t = 0; while (2 ** t < v) t++; return t; },
  // week 2
  city: (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]),
  chess: (a, b) => Math.max(Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1])),
  euclid: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]),
  mean: L => sum(L.flat()) / L.flat().length,
  harmonic: L => L.flat().length / sum(L.flat().map(v => 1 / v)),
  geometric: L => Math.exp(sum(L.flat().map(Math.log)) / L.flat().length),
  range: L => Math.max(...L.flat()) - Math.min(...L.flat()),
  michelson: L => { const f = L.flat(), a = Math.max(...f), b = Math.min(...f); return (a - b) / (a + b); },
  rms: L => { const f = L.flat(), m = sum(f) / f.length; return Math.sqrt(sum(f.map(v => (v - m) ** 2)) / f.length); },
  // week 3
  lightness: ([r, g, b]) => rnd((Math.max(r, g, b) + Math.min(r, g, b)) / 2),
  average: ([r, g, b]) => rnd((r + g + b) / 3),
  luminosity: ([r, g, b]) => rnd(0.21 * r + 0.72 * g + 0.07 * b),
  hist: (L, levels) => { const h = Array(levels).fill(0); L.flat().forEach(v => h[v]++); return h; },
  cumul: h => { let c = 0; return h.map(v => (c += v)); },
  // week 4
  levels: L => [...new Set(L.flat())].sort((a, b) => a - b),
  stretch: (v, lo, hi, t = 255) => rnd((v - lo) * t / (hi - lo)),
  percentile: (L, p) => { const s = L.flat().sort((a, b) => a - b); let k = rnd(p * (s.length + 1)); k = Math.max(1, Math.min(s.length, k)); return s[k - 1]; },
  equalise: (L, t = 255) => {
    const f = L.flat(), lv = S.levels(L), out = {}; let c = 0; const cum = {};
    lv.forEach(v => { c += f.filter(x => x === v).length; cum[v] = c; });
    const h0 = cum[lv[0]];
    lv.forEach(v => { out[v] = rnd((cum[v] - h0) / (f.length - h0) * t); });
    return out;
  },
  // week 5
  N4: [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1]],
  at: (A, i, j) => (i < 0 || j < 0 || i >= A.length || j >= A[0].length) ? 0 : A[i][j],
  dilate: (A, se = S.N4) => map2(A, (v, i, j) => se.some(([a, b]) => S.at(A, i + a, j + b)) ? 1 : 0),
  erode: (A, se = S.N4) => map2(A, (v, i, j) => se.every(([a, b]) => S.at(A, i + a, j + b)) ? 1 : 0),
  open: A => S.dilate(S.erode(A)),
  close: A => S.erode(S.dilate(A)),
  gradient: A => { const d = S.dilate(A), e = S.erode(A); return map2(d, (v, i, j) => v - e[i][j]); },
  hitmiss: (A, se) => map2(A, (v, i, j) => se.every((row, a) => row.every((want, b) => want === null || S.at(A, i + a - 1, j + b - 1) === want)) ? 1 : 0),
  CORNERS: {
    TL: [[0, 0, null], [0, 1, 1], [null, 1, null]], TR: [[null, 0, 0], [1, 1, 0], [null, 1, null]],
    BL: [[null, 1, null], [0, 1, 1], [0, 0, null]], BR: [[null, 1, null], [1, 1, 0], [null, 0, 0]],
  },
  corners: A => { const o = Object.values(S.CORNERS).map(se => S.hitmiss(A, se)); return map2(A, (v, i, j) => o.some(m => m[i][j]) ? 1 : 0); },
  // week 6
  flipLR: L => L.map(r => r.slice().reverse()),
  flipUD: L => L.slice().reverse().map(r => r.slice()),
  rot180: L => S.flipUD(S.flipLR(L)),
  transpose: L => L[0].map((_, j) => L.map(r => r[j])),
  rotP90: L => S.flipLR(S.transpose(L)),          // clockwise in (i,j) coordinates
  rotM90: L => S.flipUD(S.transpose(L)),
  antiT: L => S.rot180(S.transpose(L)),
  bilinear: (c, M, N, i, j) => (c[0][0] * (M - i) * (N - j) + c[0][1] * (M - i) * j + c[1][0] * i * (N - j) + c[1][1] * i * j) / (M * N),
  // weeks 8 and 9
  flip180: k => k.slice().reverse().map(r => r.slice().reverse()),
  corrAt: (L, k, i, j) => { const n = k.length, h = (n - 1) / 2; let s = 0; for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) s += k[a][b] * L[i - 1 - h + a][j - 1 - h + b]; return s; },
  convAt: (L, k, i, j) => S.corrAt(L, S.flip180(k), i, j),
  validCorr: (L, k) => { const n = k.length, h = (n - 1) / 2, o = []; for (let i = h + 1; i <= L.length - h; i++) { const r = []; for (let j = h + 1; j <= L[0].length - h; j++) r.push(S.corrAt(L, k, i, j)); o.push(r); } return o; },
  validConv: (L, k) => S.validCorr(L, S.flip180(k)),
  maxOut: k => 255 * sum(k.flat().filter(v => v > 0)),
  RING: [[0, 0], [0, 1], [0, 2], [1, 2], [2, 2], [2, 1], [2, 0], [1, 0]],
  kirschBank: () => Array.from({ length: 8 }, (_, z) => { const k = [[-3, -3, -3], [-3, 0, -3], [-3, -3, -3]]; for (let d = 0; d < 3; d++) { const [a, b] = S.RING[(z + d) % 8]; k[a][b] = 5; } return k; }),
  kirsch: L => Math.max(...S.kirschBank().map(k => S.corrAt(L, k, 2, 2))),
  K: {
    mean3: [[1 / 9, 1 / 9, 1 / 9], [1 / 9, 1 / 9, 1 / 9], [1 / 9, 1 / 9, 1 / 9]],
    gauss: [[1 / 16, 1 / 8, 1 / 16], [1 / 8, 1 / 4, 1 / 8], [1 / 16, 1 / 8, 1 / 16]],
    sharpen: [[0, -1, 0], [-1, 5, -1], [0, -1, 0]],
    emboss: [[1, 0, 0], [0, 0, 0], [0, 0, -1]],
    lap4: [[0, -1, 0], [-1, 4, -1], [0, -1, 0]],
    lap8: [[-1, -1, -1], [-1, 8, -1], [-1, -1, -1]],
    prewittX: [[1, 0, -1], [1, 0, -1], [1, 0, -1]], prewittY: [[1, 1, 1], [0, 0, 0], [-1, -1, -1]],
    sobelX: [[1, 0, -1], [2, 0, -2], [1, 0, -1]], sobelY: [[1, 2, 1], [0, 0, 0], [-1, -2, -1]],
    robX: [[1, 0], [0, -1]], robY: [[0, 1], [-1, 0]],
  },
  usm: L => 2 * L[1][1] - S.mean(L),
  mse: (L, t) => sum(L.flat().map((v, n) => (v - t.flat()[n]) ** 2)) / L.flat().length,
};

/* ---------- small pictures, returned as data ---------- */
const grating = (f, deg, n = 48) => Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => {
  const a = deg * Math.PI / 180, u = (j * Math.cos(a) + i * Math.sin(a)) / n;
  return Math.round(127.5 + 127.5 * Math.sin(2 * Math.PI * f * u));
}));
const spectrumSvg = (f, deg) => {
  const a = deg * Math.PI / 180, r = f * 5, x = r * Math.cos(a), y = r * Math.sin(a);
  return `<svg viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="magnitude spectrum"><rect width="80" height="80" fill="#1b1424"/><circle cx="40" cy="40" r="2.2" fill="#fff"/><circle cx="${40 + x}" cy="${40 + y}" r="3" fill="#fff"/><circle cx="${40 - x}" cy="${40 - y}" r="3" fill="#fff"/><\/svg>`;
};

/* ---------- input helpers ---------- */
const num = (ans, tol = 0) => ({ k: "num", ans, tol });
const grid = (ans, extra = {}) => ({ k: "grid", ans, ...extra });
const fields = (labels, ans, tol = 0) => ({ k: "fields", labels, ans, tol });
const mc = (right, wrongs) => { const opts = shuffle([right, ...wrongs]); return { k: "mc", opts, ans: opts.indexOf(right) }; };
const fact = bank => () => { const [q, right, ...wrongs] = pick(bank); return { stem: q, input: mc(right, wrongs), steps: [] }; };
const TOL = 0.011;
// A picture copied from the tutor's own Canvas quiz, stored in docs/img. w and h are the size it is shown at.
const real = (img, w, h) => ({ img, w, h });
const realMatch = (rows, opts, w, h) => { const v = shuffle(rows); return { input: { k: "match", left: v.map((x, n) => ({ t: "ABCDEFG"[n], ...real(x[1], x[3] || w, x[4] || h) })), opts, ans: v.map(x => opts.indexOf(x[0])) }, steps: v.map((x, n) => `${"ABCDEFG"[n]} is ${x[0]}: ${x[2]}.`) }; };

const GENS = [];
const G = (w, id, name, rule, trap, make) => GENS.push({ w, id: "w" + w + "-" + id, name, rule, trap, make });
const pos = (i, j) => `(${i},${j})`;

/* ================= Week 1 ================= */
G(1, "dims", "Rows, columns and the origin", "M counts rows and N counts columns. The origin is the top-left pixel at (1,1).", "Rows come first. A matrix with 4 rows and 3 columns has M = 4 and N = 3.", () => {
  let M = ri(2, 5), N = ri(2, 5); if (M === N) N = M === 5 ? 4 : M + 1; const L = rmat(M, N, 100, 255);
  return { stem: "For the image matrix below, give M, N and the pixel value at the origin.", show: [{ m: L, kind: "grey" }], input: fields(["M (rows)", "N (columns)", "Value at the origin"], [M, N, L[0][0]]), steps: [`There are ${M} rows, so M = ${M}. There are ${N} columns, so N = ${N}.`, `The origin is the top-left entry, which is ${L[0][0]}.`] };
});
G(1, "pixel", "Pixel at a coordinate", "(i,j) means row i, column j, counting from 1 at the top-left. Go down i rows first, then across j columns.", "It is not (x,y). Reading (3,4) as column 3, row 4 gives the wrong pixel.", () => {
  const L = rmat(5, 5, 0, 9); let i = ri(1, 5), j = ri(1, 5); if (i === j) j = i % 5 + 1;
  return { stem: `What is the value of the pixel at coordinate ${pos(i, j)}?`, show: [{ m: L, kind: "plain" }], input: num(L[i - 1][j - 1]), steps: [`Row ${i} is ${L[i - 1].join(" ")}.`, `Entry ${j} of that row is ${L[i - 1][j - 1]}.`, `The swapped reading ${pos(j, i)} would give ${L[j - 1][i - 1]}.`] };
});
G(1, "count", "Total number of pixels", "Pixels = M × N. Colour channels add values per pixel, not pixels.", "The channel count is a distraction. Do not multiply by it.", () => {
  const M = ri(2, 30), N = ri(2, 30), c = pick([3, 4]);
  return { stem: `What is the total number of pixels in an image with ${M} rows and ${N} columns that has ${c} colour channels?`, input: num(M * N), steps: [`${M} × ${N} = ${M * N} pixels.`, `Each pixel holds ${c} values, but it is still one pixel.`] };
});
G(1, "bytes", "Bytes needed to store an image", "Binary ⌈MN ÷ 8⌉. 8-bit greyscale MN. RGB 3MN. Indexed MN + 3C, where C is the number of colours in the lookup table.", "The number of unique shades or colours only matters for indexed colour. For binary, round up to a whole byte.", () => {
  const M = ri(100, 640), N = ri(100, 640), C = ri(8, 250), f = pick(["binary", "grey", "rgb", "indexed"]);
  const ans = { binary: S.bytesBinary(M, N), grey: M * N, rgb: 3 * M * N, indexed: S.bytesIndexed(M, N, C) }[f];
  const stem = { binary: `How many bytes are needed to store an image with ${M} rows and ${N} columns in binary format?`, grey: `How many bytes are needed to store an image with ${M} rows and ${N} columns that contains ${C} unique shades of grey in 8-bit greyscale format?`, rgb: `How many bytes are needed to store an RGB image with ${M} rows and ${N} columns that has ${C} unique colours?`, indexed: `How many bytes are needed to store an image with ${C} colours, ${M} rows and ${N} columns in indexed colour format? Count the pixel values and the colour lookup table.` }[f];
  const steps = { binary: [`MN = ${M * N} bits, one per pixel.`, `${M * N} ÷ 8 = ${(M * N / 8).toFixed(3)}, rounded up to ${ans} bytes.`], grey: [`One byte per pixel, so MN = ${ans}.`, `The ${C} unique shades do not change the answer.`], rgb: [`Three bytes per pixel, so 3 × ${M * N} = ${ans}.`, `The ${C} unique colours do not change the answer.`], indexed: [`One byte per pixel gives MN = ${M * N}.`, `The table holds ${C} colours at 3 bytes each, which is ${3 * C}.`, `${M * N} + ${3 * C} = ${ans}.`] }[f];
  return { stem: stem + " Count pixel data only, with no header.", input: num(ans), steps };
});
G(1, "bits", "Bits per pixel and grey levels", "Shades v = 2^t. Largest value = 2^t − 1. Bits needed t = ⌈log2(v)⌉, and log2(v) = log(v) ÷ log(2).", "The largest value is one less than the number of shades, because counting starts at 0.", () => {
  const f = pick(["shades", "max", "bits"]);
  if (f === "bits") { const v = ri(3, 70000), t = S.minBits(v); return { stem: `What is the minimum number of bits per pixel needed for a greyscale image that must represent up to ${big(v)} shades of grey?`, input: num(t), steps: [`log2(${v}) = ${(Math.log2(v)).toFixed(3)}, rounded up to ${t}.`, `Check: 2^${t} = ${big(2 ** t)} is enough, and 2^${t - 1} = ${big(2 ** (t - 1))} is not.`] }; }
  const t = ri(2, 24);
  return f === "shades" ? { stem: `How many different shades of grey are possible in a greyscale image that uses ${t} bits per pixel?`, input: num(2 ** t), steps: [`2^${t} = ${big(2 ** t)}.`] }
    : { stem: `What is the maximum possible pixel value in a greyscale image that uses ${t} bits per pixel?`, input: num(2 ** t - 1), steps: [`2^${t} − 1 = ${big(2 ** t - 1)}.`] };
});
G(1, "images", "How many different images are possible", "k^n, where k is the number of values one pixel can take and n is the number of pixels. Binary k = 2, 8-bit grey k = 256, RGB k = 256³ = 16,777,216.", "The exponent is the pixel count M × N, not M or N alone.", () => {
  const f = pick(["binary", "grey", "rgb"]);
  let M, N, k, kn;
  if (f === "binary") { M = ri(2, 6); N = ri(2, 4); k = 2n; kn = "2"; }
  else if (f === "grey") { M = ri(1, 2); N = ri(1, 3); k = 256n; kn = "256"; }
  else { M = 1; N = ri(1, 2); k = 16777216n; kn = "16,777,216"; }
  const ans = k ** BigInt(M * N);
  return { stem: `How many different ${{ binary: "binary", grey: "8-bit greyscale", rgb: "24-bit RGB" }[f]} images of size ${M} × ${N} pixels are possible?`, input: { k: "num", ans: ans.toString(), tol: 0 }, steps: [`Each pixel can take ${kn} values and there are ${M * N} pixels.`, `${kn}^${M * N} = ${big(ans)}.`] };
});
G(1, "rgb", "RGB triplets and colours", "One channel at 255 gives red, green or blue. Two at 255 give the secondaries: R+G yellow, G+B cyan, R+B magenta. All equal gives a grey, from black to white.", "Yellow is red plus green, not red plus blue.", () => {
  const all = [["(255,0,0)", "red"], ["(0,255,0)", "green"], ["(0,0,255)", "blue"], ["(255,255,0)", "yellow"], ["(0,255,255)", "cyan"], ["(255,0,255)", "magenta"], ["(255,255,255)", "white"], ["(0,0,0)", "black"], ["(128,128,128)", "grey"]];
  const p = shuffle(all).slice(0, 5), opts = all.map(a => a[1]);
  return { stem: "Match each RGB triplet to its colour.", input: { k: "match", left: p.map(a => ({ t: a[0] })), opts, ans: p.map(a => opts.indexOf(a[1])) }, steps: p.map(a => `${a[0]} is ${a[1]}.`) };
});
G(1, "formats", "Recognise the image format", "Binary has only pure black and pure white. Greyscale has smooth greys and no colour. RGB has smooth colour. Indexed colour has few colours, so a smooth background breaks into flat bands. Vector is built from points and lines, so the quiz shows it as a wire mesh.", "Indexed and RGB are both colour. Look at the background: bands mean indexed, a smooth fade means RGB.", () => {
  const r = realMatch([["greyscale", "q1-anuA", "smooth greys and no colour"], ["indexed", "q1-anuB", "colour, but the background breaks into flat bands"], ["vector", "q1-anuC", "a mesh of points and lines, not pixels"], ["RGB", "q1-anuD", "smooth colour with no banding"], ["binary", "q1-anuE", "only pure black and pure white"]], ["binary", "greyscale", "indexed", "RGB", "vector"], 150, 227);
  return { stem: "Match the images to their image formats. These are the pictures from Quiz 01.", input: r.input, steps: r.steps };
});

/* ================= Week 2 ================= */
G(2, "dist", "Distance between two pixels", "Take the two differences |Δi| and |Δj| first. City block adds them. Chessboard takes the larger. Euclidean is √(Δi² + Δj²).", "Check the order: chessboard ≤ Euclidean ≤ city block, always.", () => {
  const a = [ri(1, 320), ri(1, 320)], b = [ri(1, 320), ri(1, 320)], f = pick(["city", "chess", "euclid"]), di = Math.abs(a[0] - b[0]), dj = Math.abs(a[1] - b[1]);
  const name = { city: "city block", chess: "chessboard", euclid: "Euclidean" }[f];
  const ans = f === "euclid" ? dp2(S.euclid(a, b)) : S[f](a, b);
  return { stem: `What is the ${name} distance between a pixel at ${pos(...a)} and a pixel at ${pos(...b)}?${f === "euclid" ? " Give 2 d.p." : ""}`, input: num(ans, f === "euclid" ? TOL : 0), steps: [`|Δi| = ${di} and |Δj| = ${dj}.`, { city: `${di} + ${dj} = ${ans}.`, chess: `The larger of the two is ${ans}.`, euclid: `√(${di}² + ${dj}²) = √${di * di + dj * dj} = ${ans}.` }[f]] };
});
G(2, "bright", "Brightness as a mean", "Arithmetic: sum ÷ count. Harmonic: count ÷ sum of reciprocals. Geometric: take ln of every pixel, average them, then e to that power.", "Check the order: harmonic ≤ geometric ≤ arithmetic. Read the rounding line, because geometric is usually asked as a whole number.", () => {
  const L = rmat(3, 3, 4, 255), f = pick(["arith", "harm", "geom"]), n = 9;
  const a = S.mean(L), h = S.harmonic(L), g = S.geometric(L);
  const stem = { arith: "Calculate brightness as arithmetic mean luminance, to 2 d.p.", harm: "Calculate brightness as harmonic mean luminance, to 2 d.p.", geom: "Calculate brightness as geometric mean luminance, rounded to a whole number." }[f];
  const steps = { arith: [`Sum = ${sum(L.flat())}. Divide by ${n} to get ${dp2(a)}.`], harm: [`Sum of reciprocals = ${sum(L.flat().map(v => 1 / v)).toFixed(5)}.`, `${n} ÷ that sum = ${dp2(h)}.`], geom: [`Sum of ln(L) = ${sum(L.flat().map(Math.log)).toFixed(4)}. Divide by ${n} to get ${(Math.log(g)).toFixed(4)}.`, `e to that power = ${g.toFixed(3)}, which rounds to ${rnd(g)}.`] }[f];
  steps.push(`For this image harmonic ${dp2(h)} ≤ geometric ${dp2(g)} ≤ arithmetic ${dp2(a)}.`);
  return { stem: "For the 8-bit greyscale image matrix below. " + stem, show: [{ m: L, kind: "grey" }], input: f === "geom" ? num(rnd(g)) : num(dp2(f === "arith" ? a : h), TOL), steps };
});
G(2, "contrast", "Contrast measures", "Find Lmax and Lmin first. Range = max − min. Normalised range = range ÷ 255. Michelson = (max − min) ÷ (max + min). RMS = the standard deviation, dividing by MN.", "Normalised range divides by 255, not 256. Normalised range and Michelson both sit between 0 and 1.", () => {
  const f = pick(["range", "norm", "mich", "rms"]), L = f === "rms" ? rmat(3, 3, 20, 240) : rmat(4, 4, 2, 252), fl = L.flat(), hi = Math.max(...fl), lo = Math.min(...fl);
  if (f === "rms") { const m = S.mean(L), r = S.rms(L); return { stem: "For the 8-bit greyscale image matrix below, calculate RMS contrast to 2 d.p.", show: [{ m: L, kind: "grey" }], input: num(dp2(r), TOL), steps: [`Mean = ${dp2(m)}.`, `Squared differences from the mean sum to ${dp2(sum(fl.map(v => (v - m) ** 2)))}.`, `Divide by ${fl.length} and take the square root to get ${dp2(r)}.`] }; }
  const ans = { range: hi - lo, norm: dp2((hi - lo) / 255), mich: dp2((hi - lo) / (hi + lo)) }[f];
  const name = { range: "statistical range", norm: "normalised range, to 2 d.p.", mich: "Michelson contrast, to 2 d.p." }[f];
  return { stem: `For the 8-bit greyscale image matrix below, calculate contrast as ${name}`, show: [{ m: L, kind: "grey" }], input: num(ans, f === "range" ? 0 : TOL), steps: [`Lmax = ${hi} and Lmin = ${lo}.`, { range: `${hi} − ${lo} = ${ans}.`, norm: `(${hi} − ${lo}) ÷ 255 = ${ans}.`, mich: `(${hi} − ${lo}) ÷ (${hi} + ${lo}) = ${hi - lo} ÷ ${hi + lo} = ${ans}.` }[f]] };
});
G(2, "arith", "Image arithmetic with 8-bit limits", "Work entry by entry, then force every result into 0..255. Above 255 becomes 255. Below 0 becomes 0. The ∘ symbol means multiply matching entries.", "224 + 60 is 255, not 284. 30 − 40 is 0, not −10. L1 ∘ L2 is not matrix multiplication.", () => {
  const f = pick(["addS", "mulS", "add", "sub", "had"]);
  if (f === "addS") { const L = rmat(3, 3, 0, 255); L[ri(0, 2)][ri(0, 2)] = ri(250, 255); const s = ri(5, 60), o = map2(L, v => clip(v + s)); return { stem: `Give the output of L + S for the 8-bit greyscale image below, where S = ${s}.`, show: [{ cap: "L", m: L, kind: "grey" }], input: grid(o), steps: [`Add ${s} to every entry.`, `Any result above 255 is stored as 255.`] }; }
  if (f === "mulS") { const L = rmat(3, 3, 5, 180), s = pick([0.5, 1.5, 2, 2.5]), o = map2(L, v => clip(rnd(v * s))); return { stem: `Give the output of S · L for the 8-bit greyscale image below, where S = ${s}. Round .5 upwards.`, show: [{ cap: "L", m: L, kind: "grey" }], input: grid(o), steps: [`Multiply every entry by ${s} and round.`, `Any result above 255 is stored as 255.`] }; }
  if (f === "had") { const L = rmat(3, 3, 0, 255), B = rmat(3, 3, 0, 1), o = map2(L, (v, i, j) => v * B[i][j]); return { stem: "Give the output of L1 ∘ L2.", show: [{ cap: "L1", m: L, kind: "grey" }, { cap: "L2", m: B, kind: "bin" }], input: grid(o), steps: [`Multiply each entry of L1 by the entry in the same place in L2.`, `Where L2 is 1 the pixel is kept. Where L2 is 0 the pixel becomes 0. This is how a mask selects pixels.`] }; }
  const A = rmat(2, 3, 0, 230), B = rmat(2, 3, 0, 230), o = map2(A, (v, i, j) => clip(f === "add" ? v + B[i][j] : v - B[i][j]));
  return { stem: `Give the output of L1 ${f === "add" ? "+" : "−"} L2 for these 8-bit greyscale images.`, show: [{ cap: "L1", m: A, kind: "grey" }, { cap: "L2", m: B, kind: "grey" }], input: grid(o), steps: [f === "add" ? "Add matching entries. Anything above 255 is stored as 255." : "Subtract matching entries. Anything below 0 is stored as 0."] };
});

/* ================= Week 3 ================= */
G(3, "togrey", "RGB to greyscale", "Lightness = (largest + smallest) ÷ 2. Average = (R + G + B) ÷ 3. Luminosity = 0.21R + 0.72G + 0.07B. Round at the end.", "Lightness ignores the middle value. Luminosity weights green most, so a strong green gives a bright grey.", () => {
  const c = [ri(0, 255), ri(0, 255), ri(0, 255)], f = pick(["lightness", "average", "luminosity"]), ans = S[f](c);
  const w = { lightness: `(${Math.max(...c)} + ${Math.min(...c)}) ÷ 2 = ${(Math.max(...c) + Math.min(...c)) / 2}`, average: `(${c.join(" + ")}) ÷ 3 = ${(sum(c) / 3).toFixed(3)}`, luminosity: `0.21 × ${c[0]} + 0.72 × ${c[1]} + 0.07 × ${c[2]} = ${(0.21 * c[0]).toFixed(2)} + ${(0.72 * c[1]).toFixed(2)} + ${(0.07 * c[2]).toFixed(2)} = ${(0.21 * c[0] + 0.72 * c[1] + 0.07 * c[2]).toFixed(2)}` }[f];
  return { stem: `Using the ${f} method, what 8-bit grey value is produced for the RGB triplet (${c.join(",")})? Round to a whole number, with .5 rounding upwards.`, input: num(ans), steps: [w + ".", `Rounded, that is ${ans}.`] };
});
G(3, "bars", "Bars on a histogram", "The fewest bars is 1, when every pixel has the same value. The most is the number of possible values: 2 for binary and 2^b for a b-bit image.", "An 8-bit image can show 256 bars, not 8.", () => {
  const b = ri(2, 10);
  return { stem: `Give the minimum and maximum number of bars that can appear on the histogram of a binary image and of a ${b}-bit greyscale image.`, input: fields(["Binary, minimum", "Binary, maximum", `${b}-bit, minimum`, `${b}-bit, maximum`], [1, 2, 1, 2 ** b]), steps: [`One bar appears when all pixels share a value.`, `A ${b}-bit image has 2^${b} = ${2 ** b} possible values, so at most ${2 ** b} bars.`] };
});
G(3, "hist", "Build a histogram", "Count: tally each grey level. Normalised: count ÷ MN. Cumulative: running total of the counts. Normalised cumulative: running total ÷ MN.", "Check the totals. Counts add up to MN. The last cumulative bar is MN. The last normalised cumulative bar is 1.", () => {
  const L = rmat(5, 5, 0, 7), h = S.hist(L, 8), c = S.cumul(h), f = pick(["count", "norm", "cumul", "ncumul"]);
  const ans = { count: h, norm: h.map(v => dp2(v / 25)), cumul: c, ncumul: c.map(v => dp2(v / 25)) }[f];
  const name = { count: "count histogram", norm: "normalised count histogram, to 2 d.p.", cumul: "cumulative count histogram", ncumul: "normalised cumulative count histogram, to 2 d.p." }[f];
  return { stem: `Below is a 3-bit greyscale image with grey levels 0 to 7. Enter its ${name}`, show: [{ m: L, kind: "plain" }], input: fields(h.map((_, v) => "Level " + v), ans, f === "count" || f === "cumul" ? 0 : TOL), steps: [`Counts for levels 0 to 7 are ${h.join(", ")}. They add up to 25.`, `Running totals are ${c.join(", ")}.`, f === "norm" || f === "ncumul" ? "Divide each by MN = 25." : "No division is needed here."] };
});
G(3, "thresh", "Thresholding to a binary mask", "Write the test, then go pixel by pixel. Basic: 1 if L ≥ T. Low-pass: 1 if L ≤ T. High-pass: 1 if L ≥ T. Band-pass: 1 if T1 ≤ L ≤ T2. Band-reject: 1 if L ≤ T1 or L ≥ T2.", "A pixel equal to the threshold is included in every one of these. Band-reject is the opposite of band-pass except at the two threshold values.", () => {
  const f = pick(["basic", "low", "high", "bandpass", "bandreject"]), L = rmat(3, 3, 5, 250), T1 = ri(50, 120), T2 = T1 + ri(30, 90);
  L[ri(0, 2)][ri(0, 2)] = f === "bandreject" || f === "bandpass" ? pick([T1, T2]) : T1;
  const test = { basic: v => v >= T1, low: v => v <= T1, high: v => v >= T1, bandpass: v => v >= T1 && v <= T2, bandreject: v => v <= T1 || v >= T2 }[f];
  const name = { basic: `Convert L to a binary image using threshold T = ${T1}, where a pixel below T becomes 0 and any other pixel becomes 1.`, low: `Apply low-pass thresholding with T = ${T1}.`, high: `Apply high-pass thresholding with T = ${T1}.`, bandpass: `Apply band-pass thresholding with T1 = ${T1} and T2 = ${T2}.`, bandreject: `Apply band-reject thresholding with T1 = ${T1} and T2 = ${T2}.` }[f];
  const rule = { basic: `1 if L ≥ ${T1}`, low: `1 if L ≤ ${T1}`, high: `1 if L ≥ ${T1}`, bandpass: `1 if ${T1} ≤ L ≤ ${T2}`, bandreject: `1 if L ≤ ${T1} or L ≥ ${T2}` }[f];
  return { stem: name + " Enter the binary mask.", show: [{ cap: "L", m: L, kind: "grey" }], input: grid(map2(L, v => test(v) ? 1 : 0)), steps: [`The test is: ${rule}, otherwise 0.`, `One pixel here sits exactly on a threshold, and it passes the test.`] };
});
G(3, "multiband", "Multi-band threshold on RGB", "A pixel is 1 only when all three channel tests pass. Check the red test first and cross out failures, then test only the survivors on green, then blue.", "The comparisons here are strict. A value equal to its threshold fails.", () => {
  const R = rmat(2, 3, 0, 255), Gm = rmat(2, 3, 0, 255), B = rmat(2, 3, 0, 255), T = [pick([96, 128, 160]), pick([64, 96, 128]), pick([48, 64, 96])];
  const o = map2(R, (v, i, j) => (v < T[0] && Gm[i][j] > T[1] && B[i][j] > T[2]) ? 1 : 0);
  return { stem: `Enter the binary mask S, where S = 1 if (R < ${T[0]}) and (G > ${T[1]}) and (B > ${T[2]}), otherwise 0.`, show: [{ cap: "R", m: R, kind: "grey" }, { cap: "G", m: Gm, kind: "grey" }, { cap: "B", m: B, kind: "grey" }], input: grid(o), steps: [`R < ${T[0]} passes at ${mt(map2(R, v => v < T[0] ? 1 : 0))}.`, `G > ${T[1]} passes at ${mt(map2(Gm, v => v > T[1] ? 1 : 0))}.`, `B > ${T[2]} passes at ${mt(map2(B, v => v > T[2] ? 1 : 0))}.`, `Keep only the places where all three are 1.`] };
});
G(3, "select", "Use a mask to select pixels", "Make the mask, then keep the original value where the mask is 1 and write 0 everywhere else.", "The answer holds grey values and zeros, not ones and zeros.", () => {
  const L = rmat(3, 3, 5, 250), T = ri(70, 150), o = map2(L, v => v <= T ? v : 0);
  return { stem: `Apply low-pass thresholding with T = ${T} to L, then use the mask to select pixels. Enter the output image.`, show: [{ cap: "L", m: L, kind: "grey" }], input: grid(o), steps: [`The mask is 1 where L ≤ ${T}: ${mt(map2(L, v => v <= T ? 1 : 0))}.`, `Selected pixels keep their grey value. The rest become 0.`] };
});

/* ================= Week 4 ================= */
G(4, "effects", "Brightness arithmetic and the histogram", "Adding a positive number or multiplying by more than 1 brightens, and the bars slide right. Subtracting or multiplying by a fraction darkens, and the bars slide left. Multiplying by 0 or a negative number wipes the image to black.", "Subtracting a negative number brightens. Multiplying by a negative number gives negative values, which all become 0.", () => {
  const all = [["L' = L + S, S > 0", "brighten"], ["L' = L − S, S > 0", "darken"], ["L' = L + S, S < 0", "darken"], ["L' = L − S, S < 0", "brighten"], ["L' = L + S, S = 0", "no effect"], ["L' = L × S, S > 1", "brighten"], ["L' = L × S, S = 1", "no effect"], ["L' = L × S, S = 0", "annihilate"], ["L' = L × S, S < 0", "annihilate"], ["L' = L × S, 0 < S < 1", "darken"]];
  const p = shuffle(all).slice(0, 5), opts = ["brighten", "darken", "no effect", "annihilate"];
  return { stem: "Match each operation on image L with scalar S to its effect.", input: { k: "match", left: p.map(a => ({ t: a[0] })), opts, ans: p.map(a => opts.indexOf(a[1])) }, steps: ["Brighter images have their histogram bars further right. Darker images have them further left."] };
});
G(4, "stretchparts", "Histogram stretch, step by step", "Stretch is (L − Lmin) × t ÷ (Lmax − Lmin). Subtract Lmin so the darkest pixel is 0, then multiply by the coefficient t ÷ (Lmax − Lmin) so the brightest becomes t.", "The coefficient uses t = 255 on top, not 256. Stretch never changes how many different grey levels there are.", () => {
  const f = pick(["min", "coef", "facts"]), L = rmat(4, 4, 100, 200), fl = L.flat(), lo = Math.min(...fl), hi = Math.max(...fl);
  if (f === "min") return { stem: "The first step of a histogram stretch subtracts Lmin from every pixel. What is Lmin for this image?", show: [{ m: L, kind: "grey" }], input: num(lo), steps: [`The smallest value is ${lo}.`] };
  if (f === "coef") return { stem: "After subtracting Lmin, what coefficient do we multiply by so the output spans 0 to 255? Give 2 d.p.", show: [{ m: L, kind: "grey" }], input: num(dp2(255 / (hi - lo)), TOL), steps: [`Lmax = ${hi} and Lmin = ${lo}, so the spread is ${hi - lo}.`, `255 ÷ ${hi - lo} = ${dp2(255 / (hi - lo))}.`] };
  const a = ri(10, 60), b = a + ri(40, 120), u = ri(12, 40);
  return { stem: `Before a histogram stretch an 8-bit image has Lmin = ${a}, Lmax = ${b} and ${u} unique shades of grey. After a stretch with t = 255, give the new values.`, input: fields(["New Lmin", "New Lmax", "Unique shades"], [0, 255, u]), steps: ["The darkest pixel always lands on 0 and the brightest on t.", `Each old level maps to exactly one new level, so there are still ${u} shades.`] };
});
G(4, "stretchmap", "Histogram stretch, new grey levels", "For each level: (level − Lmin) × 255 ÷ (Lmax − Lmin), then round to the nearest whole number. Work out the coefficient once and reuse it.", "Round to nearest, do not chop. 215.77 is 216. The first level must come out as 0 and the last as 255.", () => {
  const L = rmat(3, 3, 5, 160), lv = S.levels(L), lo = lv[0], hi = lv[lv.length - 1]; if (hi === lo) L[0][0] = hi + 20;
  const l2 = S.levels(L), a = l2[0], b = l2[l2.length - 1];

/* ================= Week 7 ================= */
const win = (L, i, j) => [-1, 0, 1].flatMap(a => [-1, 0, 1].map(b => L[i - 1 + a][j - 1 + b]));
G(7, "rank", "Rank filters on a 3 × 3 window", "Box the nine pixels around the centre and sort them. Min is the first. Max is the last. Median is the fifth. Midpoint is (min + max) ÷ 2. Range is max − min.", "The window is centred on the coordinate given, so take rows i−1 to i+1 and columns j−1 to j+1. The fourth row or column of the matrix is often not in the window.", () => {

G(7, "noise", "Pick the filter for the noise", "White specks are salt, and the min filter removes them. Black specks are pepper, and the max filter removes them. Both together need the median. Fine grain all over is Gaussian noise, where the midpoint filter is the simplest choice.", "It runs opposite to what you might guess. Bright specks need the min filter, because min throws away the brightest value.", () => {

G(8, "mean", "Mean filter at a position", "A mean kernel is just the average of the window. Add the pixels under the kernel and divide by how many there are.", "A 5 × 5 kernel covers rows i−2 to i+2 and columns j−2 to j+2, so 25 pixels. Leave out the row and column that fall outside.", () => {

G(8, "apply", "Apply a 3 × 3 kernel at a position", "Lay the kernel over the window, multiply each pair, and add. Skip every zero coefficient. For sharpen: 5 × centre minus the four neighbours. For Gaussian: (4 × centre + 2 × the four edge neighbours + the four corners) ÷ 16.", "Sharpen can give a negative or very large number. If the question says to enter the full value, do not force it into 0..255.", () => {

G(8, "emboss", "Emboss, where the kernel flip matters", "Convolution turns the kernel through 180° before use. For this emboss kernel that means the answer is bottom-right neighbour minus top-left neighbour.", "Using the kernel as printed gives the same size of answer with the wrong sign. Symmetric kernels such as mean, Gaussian, sharpen and Laplacian look the same after the turn, so there the flip changes nothing.", () => {

G(9, "kirsch", "Kirsch compass", "Every Kirsch kernel has three 5s side by side on the outer ring and five −3s. So each output is 8 × (those three neighbours) − 3 × (all eight neighbours). Find the three neighbours in a row around the ring with the largest total and use that.", "The centre pixel has coefficient 0, so leave it out. The three must be next to each other going round the ring, and the ring wraps past the corner.", () => {

nd answer ÷ 3 = MN.","trap":"Using the indexed formula MN + 3C because the question gives a colour count. The format named in the question decides the formula. Here it says RGB colour format.","example":{"working":["210 × 145 = 30,450 pixels.","3 × 30,450 = 91,350."],"answer":"91,350"},"gen":"w1-bytes","same":5},{"n":8,"kind":"Formula","q":"How many bytes of memory are needed to store an image with 248 colours that has 504 rows and 312 columns in indexed colour format? (note: consider pixel values and the CLUT only, ignoring any other possible header/footer information). Formula: S_indexed = MN + 3C","given":[],"opts":[],"ans":"157,992 bytes","pics":[],"varies":"The number of colours, the number of rows and the number of columns.","method":["Each pixel stores one index, which takes 1 byte. That part is M × N.","The colour look-up table (CLUT) stores C colours at 3 bytes each. That part is 3 × C.","Add the two parts."],"check":"The answer is a little more than MN and much less than 3MN.","trap":"Leaving out the table, or multiplying MN by 3. Only the table entries take 3 bytes each. This is the one format where the colour count matters.","example":{"working":["504 × 312 = 157,248.","3 × 248 = 744.","157,248 + 744 = 157,992."],"answer":"157,992"},"gen":"w1-bytes","same":null},{"n":9,"kind":"Formula","q":"How many different shades of grey are possible (v) in a greyscale image that uses 17 bits-per-pixel (t)? Formula: v = 2^t","given":[],"opts":[],"ans":"131,072","pics":[],"varies":"The number of bits-per-pixel, t.","method":["Type 2, press the power key, type t and press =. Each extra bit doubles the number of shades."],"check":"The answer is an even number. 2¹⁰ = 1,024, so 2¹⁷ = 1,024 × 128 = 131,072.","trap":"Subtracting 1. The number of shades is 2^t. The largest value is 2^t − 1.","example":{"working":["2¹⁷ = 131,072."],"answer":"131,072"},"gen":"w1-bits","same":null},{"n":10,"kind":"Formula","q":"What is the maximum possible pixel value (v_max) in a greyscale image that uses 24 bits-per-pixel (t)? Formula: v_max = 2^t − 1","given":[],"opts":[],"ans":"16,777,215","pics":[],"varies":"The number of bits-per-pixel, t.","method":["Work out 2 to the power t, as in Question 9.","Subtract 1, because pixel values start at 0."],"check":"The answer is an odd number. For t = 8 the same rule gives 255.","trap":"Giving 2^t. That is the number of shades, which is one more than the largest value.","example":{"working":["2²⁴ = 16,777,216.","16,777,216 − 1 = 16,777,215."],"answer":"16,777,215"},"gen":"w1-bits","same":9},{"n":11,"kind":"Formula","q":"What is the minimum number of bits-per-pixel (t) that would be needed to store a greyscale medical image of size 530 × 716 pixels that needs to be able to represent up to 20825 shades of grey (v)? Formula: t = ⌈log₂(v)⌉, such that log₂(x) = log_a(x) ÷ log_a(2), e.g., log₂(x) = log₁₀(x) ÷ log₁₀(2) = ln(x) ÷ ln(2)","given":[],"opts":[],"ans":"15 bits-per-pixel","pics":[],"varies":"The image size and the number of shades of grey, v.","method":["Ignore the image size. Only the number of shades v matters.","On the calculator, work out log(v) ÷ log(2).","Round the result up to the next whole number."],"check":"2^t must be at least v, and 2^(t−1) must be less than v. Here 2¹⁵ = 32,768 is enough and 2¹⁴ = 16,384 is not.","trap":"Rounding 14.35 to the nearest whole number, which gives 14. With 14 bits there are only 16,384 shades. Always round up.","example":{"working":["log(20825) ÷ log(2) = 14.346.","Round up to 15.","Check: 2¹⁴ = 16,384 < 20,825 ≤ 32,768 = 2¹⁵."],"answer":"15"},"gen":"w1-bits","same":null},{"n":12,"kind":"Formula","q":"How many different binary images of size 7 × 3 pixels are possible? Formula: kⁿ","given":[],"opts":[],"ans":"2,097,152","pics":[],"varies":"The image size.","method":["k is the number of values one pixel can take. For binary, k = 2.","n is the number of pixels. n = M × N.","Work out k to the power n."],"check":"The answer is a power of 2, so it is even. 2¹⁰ = 1,024, so 2²¹ = 2 × 1,024 × 1,024.","trap":"Using M or N alone as the power, or multiplying k by n. The power is the full pixel count M × N.","example":{"working":["k = 2.","n = 7 × 3 = 21.","2²¹ = 2,097,152."],"answer":"2,097,152"},"gen":"w1-images","same":null},{"n":13,"kind":"Formula","q":"How many different 8-bit greyscale images of size 2 × 2 pixels are possible? Formula: kⁿ","given":[],"opts":[],"ans":"4,294,967,296","pics":[],"varies":"The image size.","method":["An 8-bit pixel can take 2⁸ = 256 values, so k = 256.","n is the number of pixels. n = M × N.","Work out k to the power n."],"check":"256⁴ = 2³². Type the full number with no rounding. A calculator that shows 4.294967296 × 10⁹ still gives every digit.","trap":"Using k = 8 or k = 255. An 8-bit pixel has 256 possible values, 0 to 255.","example":{"working":["k = 256.","n = 2 × 2 = 4.","256⁴ = 4,294,967,296."],"answer":"4,294,967,296"},"gen":"w1-images","same":12},{"n":14,"kind":"Numeric","q":"How many different RGB images of size 1 × 1 pixel are possible?","given":[],"opts":[],"ans":"16,777,216","pics":[],"varies":"The question type is Numeric, not Formula, so the size may stay 1 × 1.","method":["An RGB pixel has three 8-bit channels. Each channel has 256 values, so k = 256 × 256 × 256 = 16,777,216.","n is the number of pixels. A 1 × 1 image has n = 1.","Work out k to the power n. With n = 1 the answer is k."],"check":"The answer is 2²⁴, which is one more than the largest 24-bit value in Question 10.","trap":"Answering 256 or 3 × 256 = 768. The three channels multiply, because every red value can go with every green value and every blue value.","example":{"working":["k = 256³ = 16,777,216.","n = 1 × 1 = 1.","16,777,216¹ = 16,777,216."],"answer":"16,777,216"},"gen":"w1-images","same":12},{"n":15,"kind":"Matching","q":"The RGB colourspace mixes the red, green and blue primary colours of light in different proportions to produce a range of other colours (called the gamut of the colourspace). It is usually represented as cubic coordinate system. Match the RGB triplets to the corresponding colours.","given":[],"opts":["red","green","white","yellow","cyan","grey","blue","magenta","black"],"ans":"(255,0,0) is red. (0,255,0) is green. (0,0,255) is blue. (255,255,0) is yellow. (0,255,255) is cyan. (255,0,255) is magenta. (255,255,255) is white. (128,128,128) is grey. (0,0,0) is black.","pics":[],"varies":"The nine triplets look fixed. Canvas may change the order of the rows.","method":["The triplet order is (red, green, blue). One channel at 255 and the others at 0 gives that primary colour.","Two channels at 255 give a secondary colour. Red + green is yellow. Green + blue is cyan. Red + blue is magenta.","Three equal channels give a grey. All 0 is black, all 255 is white, and all 128 is mid grey."],"check":"Each secondary colour is missing one channel. Yellow has no blue. Cyan has no red. Magenta has no green.","trap":"Thinking of paint. In light, red + green makes yellow and red + blue makes magenta.","example":null,"gen":"w1-rgb","same":null}]},"2":{"quiz":2,"title":"Basic Image Statistics and Arithmetic","cards":[{"n":1,"kind":"Formula","q":"What is the city block distance between two pixels, a and b, one at (308,154) and one at (293,193), in a 2D image (i.e., where D = 2)? Formula: d_cityblock(a,b) = Σ |a_k − b_k|, summed for k = 1 to D","given":[],"opts":[],"ans":"54","pics":[],"varies":"The two coordinates.","method":["Subtract the two row numbers and drop the sign. This is |Δi|.","Subtract the two column numbers and drop the sign. This is |Δj|.","Add |Δi| and |Δj|."],"check":"City block is the largest of the three distances. It must be at least as big as the larger of |Δi| and |Δj|, and no bigger than twice that.","trap":"Adding the coordinates themselves, or adding a third number to the two differences. Write |Δi| and |Δj| on paper first, then add only those two numbers.","example":{"working":["|Δi| = |308 − 293| = 15.","|Δj| = |154 − 193| = 39.","15 + 39 = 54."],"answer":"54"},"gen":"w2-dist","same":null},{"n":2,"kind":"Formula","q":"What is the chessboard distance between two pixels, a and b, one at (44,148) and one at (196,96), in a 2D image (i.e., where D = 2)? Formula: d_chessboard(a,b) = max(|a_i − b_i|, |a_j − b_j|)","given":[],"opts":[],"ans":"152","pics":[],"varies":"The two coordinates.","method":["Find |Δi| and |Δj| as in Question 1.","Take the larger of the two. Do not add them."],"check":"Chessboard is the smallest of the three distances. It equals one of the two differences exactly.","trap":"Adding the two differences. That gives the city block distance, 204 here.","example":{"working":["|Δi| = |44 − 196| = 152.","|Δj| = |148 − 96| = 52.","The larger is 152."],"answer":"152"},"gen":"w2-dist","same":1},{"n":3,"kind":"Formula","q":"What is the Euclidean distance between two pixels, a and b, one at (105,141) and one at (119,85), in a 2D image (i.e., where D = 2)? Round your answer to 2 d.p. Formula: d_euclidean(a,b) = √((a_i − b_i)² + (a_j − b_j)²)","given":[],"opts":[],"ans":"57.72","pics":[],"varies":"The two coordinates.","method":["Find |Δi| and |Δj| as in Question 1.","Square each one and add the squares.","Take the square root. Round to 2 decimal places."],"check":"The order is always chessboard ≤ Euclidean ≤ city block. Here 56 ≤ 57.72 ≤ 70.","trap":"Rounding early, or cutting the decimals off. Keep the full calculator value until the last step, then round.","example":{"working":["|Δi| = |105 − 119| = 14.","|Δj| = |141 − 85| = 56.","14² + 56² = 196 + 3,136 = 3,332.","√3,332 = 57.7235, which rounds to 57.72."],"answer":"57.72"},"gen":"w2-dist","same":1},{"n":4,"kind":"Formula","q":"For the 8-bit greyscale image matrix shown below: Calculate brightness as arithmetic mean luminance. Round your answer to be 2 d.p. Formula: L̄_arith = (1 ÷ MN) × Σ L(i,j), summed over all pixels","given":[{"cap":"L","m":[[166,96,73],[60,183,37],[180,69,14]]}],"opts":[],"ans":"97.56","pics":[],"varies":"The nine matrix values.","method":["Add all the pixel values.","Divide by the number of pixels, MN.","Round to 2 decimal places."],"check":"The mean lies between the smallest and the largest pixel value. It is the largest of the three means.","trap":"Cutting the decimals off. 97.5556 rounds to 97.56, so 97.5 and 97.55 are both wrong. Always type two decimal places and round the second one.","example":{"working":["Sum = 166 + 96 + 73 + 60 + 183 + 37 + 180 + 69 + 14 = 878.","878 ÷ 9 = 97.5556, which rounds to 97.56."],"answer":"97.56"},"gen":"w2-bright","same":null},{"n":5,"kind":"Formula","q":"For the 8-bit greyscale image matrix shown below: Calculate brightness as harmonic mean luminance. Round your answer to 2 d.p. Formula: L̄_harm = MN ÷ Σ (1 ÷ L(i,j)), summed over all pixels","given":[{"cap":"L","m":[[121,219,12],[115,162,21],[76,106,255]]}],"opts":[],"ans":"48.61","pics":[],"varies":"The nine matrix values.","method":["Work out 1 ÷ L for every pixel and add them all. Use the x⁻¹ key and keep the running total in the calculator.","Divide MN by that total.","Round to 2 decimal places."],"check":"The harmonic mean is the smallest of the three means, and small pixel values pull it down. Here the arithmetic mean is 120.78 and the harmonic mean is 48.61.","trap":"Dividing the total by MN. That is upside down and gives a tiny number such as 0.02. MN goes on top.","example":{"working":["Sum of 1 ÷ L = 0.00826 + 0.00457 + 0.08333 + 0.00870 + 0.00617 + 0.04762 + 0.01316 + 0.00943 + 0.00392 = 0.185165.","9 ÷ 0.185165 = 48.6053, which rounds to 48.61."],"answer":"48.61"},"gen":"w2-bright","same":null},{"n":6,"kind":"Formula","q":"For the 8-bit greyscale image matrix shown below: Calculate brightness as geometric mean luminance. Round your answer to be ∈ ℕ. Formula: L̄_geom = (Π L(i,j))^(1 ÷ MN) = exp((1 ÷ MN) × Σ ln(L(i,j)))","given":[{"cap":"L","m":[[36,33,126],[142,159,110],[166,90,148]]}],"opts":[],"ans":"98","pics":[],"varies":"The nine matrix values.","method":["Multiply all the pixel values together in one line on the calculator. The product is very large, so the display switches to × 10 to a power.","Leave the product on the display. Raise it to the power 1 ÷ MN, with the 1 ÷ MN in brackets.","Read the rounding line. ∈ ℕ means a whole number, so round to the nearest whole number."],"check":"Add ln of every pixel, divide by MN and press eˣ. That route gives the same value. The order is always harmonic ≤ geometric ≤ arithmetic. Here 80.12 ≤ 97.85 ≤ 112.22.","trap":"Typing 97.85. The question asks for a whole number (∈ ℕ), so the answer is 98. Questions 4 and 5 ask for 2 decimal places and this question does not.","example":{"working":["36 × 33 × 126 × 142 × 159 × 110 × 166 × 90 × 148 = 8.2201 × 10¹⁷.","(8.2201 × 10¹⁷)^(1 ÷ 9) = 97.846, which rounds to 98."],"answer":"98"},"gen":"w2-bright","same":null},{"n":7,"kind":"Formula","q":"For 8-bit greyscale image matrix shown below: Calculate contrast as statistical range. Formula: C_range(L) = L_max − L_min","given":[{"cap":"L","m":[[234,133,4,162],[61,249,33,74],[42,109,97,85],[252,73,114,10]]}],"opts":[],"ans":"248","pics":[],"varies":"The sixteen matrix values.","method":["Scan every row and mark the largest value, L_max.","Scan every row again and mark the smallest value, L_min.","Subtract. Range = L_max − L_min."],"check":"Look through the matrix once more for anything larger than L_max or smaller than L_min. The range is a whole number from 0 to 255.","trap":"Missing the true smallest value. A one-digit value such as 4 is easy to pass over next to 10.","example":{"working":["L_max = 252.","L_min = 4.","252 − 4 = 248."],"answer":"248"},"gen":"w2-contrast","same":null},{"n":8,"kind":"Formula","q":"For 8-bit (i.e, where bits-per-pixel b = 8) greyscale image matrix shown below: Calculate contrast as normalised range. Round your answer to 2 d.p. Formula: C_normRange(L) = (L_max − L_min) ÷ (2^b − 1)","given":[{"cap":"L","m":[[223,161,88,27],[16,80,154,117],[2,77,214,211],[36,81,243,211]]}],"opts":[],"ans":"0.95","pics":[],"varies":"The sixteen matrix values.","method":["Find L_max and L_min as in Question 7.","Divide the range by 2^b − 1. For 8-bit that is 255.","Round to 2 decimal places."],"check":"The answer lies between 0 and 1.","trap":"Picking the wrong smallest value. Here L_min is 2. Taking 16 gives 227 ÷ 255 = 0.89. The other mistake is dividing by 256.","example":{"working":["L_max = 243 and L_min = 2.","243 − 2 = 241.","241 ÷ 255 = 0.9451, which rounds to 0.95."],"answer":"0.95"},"gen":"w2-contrast","same":7},{"n":9,"kind":"Formula","q":"For 8-bit greyscale image matrix shown below: Calculate Michelson contrast. Round your answer to 2 d.p. Formula: C_mich(L) = (L_max − L_min) ÷ (L_max + L_min)","given":[{"cap":"L","m":[[247,183,252,57],[154,19,167,117],[124,132,99,173],[123,246,46,7]]}],"opts":[],"ans":"0.95","pics":[],"varies":"The sixteen matrix values.","method":["Find L_max and L_min as in Question 7.","Work out the top, L_max − L_min, and the bottom, L_max + L_min.","Divide top by bottom. Round to 2 decimal places."],"check":"The answer lies between 0 and 1. It is close to 1 when L_min is small.","trap":"Dividing by 255. That is the normalised range in Question 8. Michelson divides by the sum L_max + L_min.","example":{"working":["L_max = 252 and L_min = 7.","252 − 7 = 245 and 252 + 7 = 259.","245 ÷ 259 = 0.9459, which rounds to 0.95."],"answer":"0.95"},"gen":"w2-contrast","same":7},{"n":10,"kind":"Formula","q":"For the 8-bit greyscale image matrix shown below: Calculate RMS contrast. Round your answer to 2 d.p. Formula: C_rms(L) = √((1 ÷ MN) × Σ (L − L̄)²), summed over all pixels","given":[{"cap":"L","m":[[204,105,157],[143,60,164],[125,110,127]]}],"opts":[],"ans":"38.61","pics":[],"varies":"The nine matrix values.","method":["RMS contrast is the population standard deviation of the pixel values. Put the calculator in one-variable statistics mode.","Type every pixel value into the data list.","Open the statistics results and check that n = MN. A different n means a value is missing or typed twice.","Read σx. Round to 2 decimal places."],"check":"By hand, √(Σ L² ÷ MN − L̄²) gives the same value. Here Σ L² = 172,089 and L̄ = 132.78, so √(19,121 − 17,629.94) = 38.61. The answer is also smaller than the range, which is 144 here.","trap":"Reading sx. sx divides by MN − 1 and gives 40.96 here. σx divides by MN, which is what the formula asks for. By hand, the usual slip is taking the root before dividing by MN, which gives √13,419.56 = 115.84.","example":{"working":["Data list: 204, 105, 157, 143, 60, 164, 125, 110, 127.","n = 9.","σx = 38.6143, which rounds to 38.61."],"answer":"38.61"},"gen":"w2-contrast","same":null},{"n":11,"kind":"Fill in the Blank","q":"Given the 8-bit greyscale image matrix shown below and a scalar S = 5, enter the values of the output pixels at each coordinate following the operation: L + S","given":[{"cap":"L₁","m":[[99,16,0],[34,32,96],[10,254,33]]}],"opts":[],"ans":"Row 1: 104, 21, 5. Row 2: 39, 37, 101. Row 3: 15, 255, 38.","pics":[],"varies":"Nothing on Canvas. The test may still use other numbers.","method":["Add S to every pixel.","Look for any result above 255. Write 255 there. This is called clamping to the upper limit.","If S is negative, look for any result below 0 and write 0 there."],"check":"Every output value is between 0 and 255. Every value that was not clamped differs from the input by exactly S.","trap":"Writing 259 for 254 + 5. An 8-bit pixel cannot hold more than 255, so the answer in that cell is 255.","example":{"working":["Row 1: 99 + 5 = 104, 16 + 5 = 21, 0 + 5 = 5.","Row 2: 34 + 5 = 39, 32 + 5 = 37, 96 + 5 = 101.","Row 3: 10 + 5 = 15, 254 + 5 = 259 which is clamped to 255, 33 + 5 = 38."],"answer":"Row 1: 104, 21, 5. Row 2: 39, 37, 101. Row 3: 15, 255, 38."},"gen":"w2-arith","same":null},{"n":12,"kind":"Fill in the Blank","q":"Given the 8-bit greyscale image matrix shown below and a scalar S = 1.5, enter the values of the output pixels at each coordinate following the operation: L′ = S · L","given":[{"cap":"L₁","m":[[10,20,10],[20,50,20],[10,30,10]]}],"opts":[],"ans":"Row 1: 15, 30, 15. Row 2: 30, 75, 30. Row 3: 15, 45, 15.","pics":[],"varies":"Nothing on Canvas. The test may still use other numbers.","method":["Multiply every pixel by S.","If a result is not a whole number, round it to the nearest whole number, with .5 going up.","Clamp any result above 255 to 255."],"check":"S is more than 1, so every output is larger than its input. With S between 0 and 1 every output would be smaller.","trap":"Multiplying by 0.5, which gives 5, 10, 5 in row 1. That is only the extra half. S · L means the whole pixel times 1.5.","example":{"working":["Row 1: 10 × 1.5 = 15, 20 × 1.5 = 30, 10 × 1.5 = 15.","Row 2: 20 × 1.5 = 30, 50 × 1.5 = 75, 20 × 1.5 = 30.","Row 3: 10 × 1.5 = 15, 30 × 1.5 = 45, 10 × 1.5 = 15."],"answer":"Row 1: 15, 30, 15. Row 2: 30, 75, 30. Row 3: 15, 45, 15."},"gen":"w2-arith","same":11},{"n":13,"kind":"Fill in the Blank","q":"Given the 8-bit greyscale image matrices shown below, enter the values of the output pixels at each coordinate following the operation: L₁ + L₂","given":[{"cap":"L₁","m":[[0,16,32],[64,128,224]]},{"cap":"L₂","m":[[10,20,30],[40,50,60]]}],"opts":[],"ans":"Row 1: 10, 36, 62. Row 2: 104, 178, 255.","pics":[],"varies":"Nothing on Canvas. The test may still use other numbers.","method":["Add the two pixels that sit in the same place, one place at a time.","Clamp any result above 255 to 255."],"check":"No output value is above 255. Look at the largest pair first, because the largest pair is the most likely to pass 255.","trap":"Typing 284 for 224 + 60. The sum is above 255, so the stored value is 255.","example":{"working":["Row 1: 0 + 10 = 10, 16 + 20 = 36, 32 + 30 = 62.","Row 2: 64 + 40 = 104, 128 + 50 = 178, 224 + 60 = 284 which is clamped to 255."],"answer":"Row 1: 10, 36, 62. Row 2: 104, 178, 255."},"gen":"w2-arith","same":null},{"n":14,"kind":"Fill in the Blank","q":"Given the 8-bit greyscale image matrices shown below, enter the values of the output pixels at each coordinate following the image arithmetic operation: L₁ − L₂","given":[{"cap":"L₁","m":[[10,20],[30,40],[50,60]]},{"cap":"L₂","m":[[60,50],[40,30],[20,10]]}],"opts":[],"ans":"Row 1: 0, 0. Row 2: 0, 10. Row 3: 30, 50.","pics":[],"varies":"Nothing on Canvas. The test may still use other numbers.","method":["Subtract the L₂ pixel from the L₁ pixel in the same place.","Clamp any result below 0 to 0. This is an underflow."],"check":"No output value is negative. A cell is 0 wherever the L₂ pixel is larger than the L₁ pixel.","trap":"Writing −50, −30 and −10. An 8-bit pixel cannot be negative, so those three cells are 0. Keep the order L₁ − L₂.","example":{"working":["Row 1: 10 − 60 = −50 which is clamped to 0, 20 − 50 = −30 which is clamped to 0.","Row 2: 30 − 40 = −10 which is clamped to 0, 40 − 30 = 10.","Row 3: 50 − 20 = 30, 60 − 10 = 50."],"answer":"Row 1: 0, 0. Row 2: 0, 10. Row 3: 30, 50."},"gen":"w2-arith","same":13},{"n":15,"kind":"Fill in the Blank","q":"Given the 8-bit greyscale image matrices shown below, enter the values of the output pixels at each coordinate following the operation: L₁ ∘ L₂","given":[{"cap":"L₁","m":[[50,100,255],[50,128,16],[50,32,0]]},{"cap":"L₂","m":[[1,0,0],[0,1,0],[0,0,1]]}],"opts":[],"ans":"Row 1: 50, 0, 0. Row 2: 0, 128, 0. Row 3: 0, 0, 0.","pics":[],"varies":"Nothing on Canvas. The test may still use other numbers.","method":["The ∘ symbol is the Hadamard product. Multiply the two pixels that sit in the same place.","Here L₂ is a binary mask. Where L₂ is 1, copy the L₁ pixel. Where L₂ is 0, write 0."],"check":"The output has a 0 in every place where the mask has a 0.","trap":"Doing normal matrix multiplication with rows times columns. The other mistake is copying the mask's 1 into the last cell. L₁ is 0 there, so the product is 0.","example":{"working":["Row 1: 50 × 1 = 50, 100 × 0 = 0, 255 × 0 = 0.","Row 2: 50 × 0 = 0, 128 × 1 = 128, 16 × 0 = 0.","Row 3: 50 × 0 = 0, 32 × 0 = 0, 0 × 1 = 0."],"answer":"Row 1: 50, 0, 0. Row 2: 0, 128, 0. Row 3: 0, 0, 0."},"gen":"w2-arith","same":null}]},"3":{"quiz":3,"title":"Histograms and Thresholding","cards":[{"n":1,"kind":"Formula","q":"If we were to convert an RGB colour image to 8-bit greyscale using the lightness method, what greyscale value would be produced for a pixel with the RGB triplet (32,176,202)? Round any answer ∈ ℝ/ℕ to be ∈ ℕ, and round .5 upwards. Formula: L(i,j) = (max(R, G, B) + min(R, G, B)) ÷ 2","given":[],"opts":[],"ans":"117","pics":[],"varies":"The RGB triplet.","method":["Pick the largest and the smallest of the three channel values. Ignore the middle one.","Add them and divide by 2.","If the result ends in .5, round it up to the next whole number."],"check":"The answer is half way between the smallest and the largest channel value.","trap":"Using all three values. That is the average method in Question 2. Lightness uses only the largest and the smallest.","example":{"working":["Largest = 202 and smallest = 32.","(202 + 32) ÷ 2 = 117."],"answer":"117"},"gen":"w3-togrey","same":null},{"n":2,"kind":"Formula","q":"If we were to convert an RGB colour image to 8-bit greyscale using the average method, what greyscale value would be produced for a pixel with the RGB triplet (227,117,111)? Round any answer ∈ ℝ/ℕ to be ∈ ℕ, and round .5 upwards. Formula: L(i,j) = (R + G + B) ÷ 3","given":[],"opts":[],"ans":"152","pics":[],"varies":"The RGB triplet.","method":["Add the three channel values.","Divide by 3.","Round to the nearest whole number."],"check":"The answer lies between the smallest and the largest channel value.","trap":"Cutting the decimals off. 151.67 rounds to 152, so 151 is wrong.","example":{"working":["227 + 117 + 111 = 455.","455 ÷ 3 = 151.67, which rounds to 152."],"answer":"152"},"gen":"w3-togrey","same":null},{"n":3,"kind":"Formula","q":"If we were to convert an RGB colour image to 8-bit greyscale using the luminosity method, what greyscale value would be produced for a pixel with the RGB triplet (155,252,67)? Round any fractional value to the nearest integer, and round .5 upwards. Formula: L(i,j) = 0.21R + 0.72G + 0.07B","given":[],"opts":[],"ans":"219","pics":[],"varies":"The RGB triplet.","method":["Type the whole sum into the calculator in one line, 0.21 × R + 0.72 × G + 0.07 × B, and press =.","Round the result to the nearest whole number."],"check":"The three weights add up to 1, so the answer lies between the smallest and the largest channel value. Green has the largest weight, so a high green value gives a high answer.","trap":"Giving a weight to the wrong channel. The order is red 0.21, green 0.72, blue 0.07. Rounding each product before adding is the other mistake. Round once, at the end.","example":{"working":["0.21 × 155 + 0.72 × 252 + 0.07 × 67 = 218.68.","218.68 rounds to 219."],"answer":"219"},"gen":"w3-togrey","same":null},{"n":4,"kind":"Fill in the Blank","q":"Convert the greyscale image matrix L, below, to a binary image matrix, B, using a threshold value T = 119 (which is sRGB middle grey). Formula: B(i,j) = 0 if L(i,j) < T, 1 else","given":[{"cap":"L","m":[[32,96,128],[255,112,64]]}],"opts":[],"ans":"Row 1: 0, 0, 1. Row 2: 1, 0, 0.","pics":[],"varies":"The test may use a different matrix or T.","method":["Write the test next to the matrix. A pixel becomes 0 if L < T and 1 otherwise.","Go through the pixels one at a time. A pixel below T becomes 0.","A pixel equal to T or above T becomes 1."],"check":"The output has only 0s and 1s and the same shape as L. Dark pixels are 0 and bright pixels are 1.","trap":"Giving 0 to a pixel that is equal to T. The test is strictly less than, so a pixel equal to T becomes 1.","example":{"working":["Row 1: 32 < 119 gives 0, 96 < 119 gives 0, 128 ≥ 119 gives 1.","Row 2: 255 ≥ 119 gives 1, 112 < 119 gives 0, 64 < 119 gives 0."],"answer":"Row 1: 0, 0, 1. Row 2: 1, 0, 0."},"gen":"w3-thresh","same":null},{"n":5,"kind":"Fill in the Blank","q":"The minimum number of bars that can appear on an image histogram of a binary image is ___ and the maximum number of bars is ___. The minimum number of bars that can appear on an image histogram of an 8-bit greyscale image is ___ and the maximum number of bars is ___.","given":[],"opts":[],"ans":"Binary: minimum 1, maximum 2. 8-bit greyscale: minimum 1, maximum 256.","pics":[],"varies":"The question looks fixed. The test may ask about a different bit depth.","method":["A histogram has one bar for each pixel value that is present in the image.","The minimum is 1. That happens when every pixel has the same value.","The maximum is the number of possible values. That is 2 for binary and 2^b for a b-bit image. For 8-bit, 2⁸ = 256."],"check":"The maximum number of bars equals the number of shades from Quiz 01, v = 2^t.","trap":"Giving 8 for the 8-bit maximum. 8 is the number of bits. The number of possible values is 2⁸ = 256, from 0 to 255.","example":{"working":["Binary: values 0 and 1, so at most 2 bars and at least 1.","8-bit greyscale: values 0 to 255, so at most 2⁸ = 256 bars and at least 1."],"answer":"1, 2, 1, 256"},"gen":"w3-bars","same":null},{"n":6,"kind":"Fill in the Blank","q":"Below is a 3-bit greyscale image (thus with possible grey levels from 0..7). Enter the values for its count histogram.","given":[{"cap":"L","m":[[0,5,5,7,3],[0,2,1,1,1],[4,4,2,5,5],[1,6,6,2,5],[3,6,6,0,1]]}],"opts":[],"ans":"Luminance 0: 3. 1: 5. 2: 3. 3: 2. 4: 2. 5: 5. 6: 4. 7: 1.","pics":[],"varies":"Questions 6 to 9 all use this matrix. The test may use a different matrix.","method":["Write the levels 0 to 7 in a column.","Go through the matrix one pixel at a time and put a tally mark next to its level. Cross each pixel off as you go.","Count the tally marks for each level."],"check":"The counts add up to MN. Here 3 + 5 + 3 + 2 + 2 + 5 + 4 + 1 = 25 = 5 × 5.","trap":"Counting level by level and missing a pixel. Tally pixel by pixel, then add the counts. A total that is not MN means a miscount.","example":{"working":["Level 0 appears 3 times, level 1 appears 5 times, level 2 appears 3 times, level 3 appears 2 times.","Level 4 appears 2 times, level 5 appears 5 times, level 6 appears 4 times, level 7 appears 1 time.","Total = 25."],"answer":"3, 5, 3, 2, 2, 5, 4, 1"},"gen":"w3-hist","same":null},{"n":7,"kind":"Fill in the Blank","q":"Below is a 3-bit greyscale image (thus with possible grey levels from 0..7). Enter the values for its normalised count histogram to 2 decimal places (2 dp).","given":[{"cap":"L","m":[[0,5,5,7,3],[0,2,1,1,1],[4,4,2,5,5],[1,6,6,2,5],[3,6,6,0,1]]}],"opts":[],"ans":"Luminance 0: 0.12. 1: 0.20. 2: 0.12. 3: 0.08. 4: 0.08. 5: 0.20. 6: 0.16. 7: 0.04.","pics":[],"varies":"Same matrix as Question 6.","method":["Build the count histogram as in Question 6.","Divide every count by MN.","Round each value to 2 decimal places."],"check":"The normalised counts add up to 1.","trap":"Dividing by the number of levels (8) or by the largest count. The divisor is the number of pixels, MN = 25.","example":{"working":["Counts: 3, 5, 3, 2, 2, 5, 4, 1. MN = 25.","3 ÷ 25 = 0.12, 5 ÷ 25 = 0.20, 2 ÷ 25 = 0.08, 4 ÷ 25 = 0.16, 1 ÷ 25 = 0.04.","Total = 1.00."],"answer":"0.12, 0.20, 0.12, 0.08, 0.08, 0.20, 0.16, 0.04"},"gen":"w3-hist","same":6},{"n":8,"kind":"Fill in the Blank","q":"Below is a 3-bit greyscale image (thus with possible grey levels from 0..7). Enter the values for its cumulative count histogram.","given":[{"cap":"L","m":[[0,5,5,7,3],[0,2,1,1,1],[4,4,2,5,5],[1,6,6,2,5],[3,6,6,0,1]]}],"opts":[],"ans":"Luminance 0: 3. 1: 8. 2: 11. 3: 13. 4: 15. 5: 20. 6: 24. 7: 25.","pics":[],"varies":"Same matrix as Question 6.","method":["Build the count histogram as in Question 6.","The first cumulative value is the first count.","For each next level, add its count to the cumulative value of the level before."],"check":"The values never go down. The last value is MN, which is 25 here.","trap":"Giving the plain counts again. Each cumulative value is the count of that level plus the counts of all the levels
